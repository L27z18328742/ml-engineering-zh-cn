<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练性能优化 · ML Engineering 中文版</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/katex/katex.min.css"></head><body><header class="topbar"><a class="brand" href="../index.html">ML Engineering 中文版</a><nav class="chapnav"><a href="../full.html">全文阅读</a><a href="https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/training/performance/README.md">英文原文</a></nav></header><div class="layout"><aside class="sidebar"><nav class="toc"><h2>本章目录</h2></nav></aside><main class="main"><article class="prose"><script type="application/json" class="document-data">{"markdown": "# 调优软件，获得最佳性能\n\n模型训练越快，完成越早。这不仅关系到抢先发表，也可能节省大量资金。\n\n总体而言，最大化吞吐量，就是反复实验、测量结果，再选择更好的方案。\n\n有时，建模团队会要求使用不利于吞吐量、却有利于模型整体效果的超参数。\n\n## 术语与概念\n\n- HFU：Hardware FLOPS Utilization，硬件 FLOPS 利用率。\n- MFU：Model FLOPS Utilization，模型 FLOPS 利用率。\n\n### MAC、FLOP、FLOPS 与 FLOP/s\n\n本节澄清常见性能指标的定义及关系。\n\n**MAC 与 FLOP：**\n\n- 1 FLOP，即一次浮点运算，可以是加、减、乘或除。\n- 1 MAC，即乘加累积，是一次乘法后接一次加法：`a * b + c`。\n\n因此 1 MAC＝2 FLOPs。现代硬件在一个时钟周期内执行一次 MAC 也很常见。\n\n从 FLOPs 换算 MAC 数量时，关系反过来：MACs＝0.5 FLOPs。虽然刚说 1 MAC＝2 FLOPs，看似绕口，但 100 FLOPs＝50 MACs，因为每个 MAC 含两次浮点运算。\n\n不过，1 MAC＝2 FLOPs，并不意味着任意 2 FLOPs 都等于 1 MAC。例如，重复计算 `.5*.6` 一百次是 100 FLOPs，但这里对应 100 次只执行乘法部分的 MAC。\n\n**FLOP、FLOPS 与 FLOP/s：**\n\n- 1 FLOP 是一次浮点加、减、乘或除。\n- FLOPS 表示每秒浮点运算数，参见 [FLOPS](https://en.wikipedia.org/wiki/FLOPS)。\n\n常见缩写还有 GFLOPS、TFLOPS 等，因为 150 TFLOPS 比 150000000000000 FLOPS 容易理解得多。\n\n书面上的 FLOPS 有歧义：有人用它表示运算总数，有人表示每秒运算数。后者更常见，也是本书采用的定义。\n\n科学写作中常用 FLOP/s 明确表示每秒，但转成变量名、去掉非法字符后，又会变成 `flops`。\n\n有时也会看到 FLOPs，但大小写很容易混淆，仍可能指任一含义。\n\n定义不清时，应结合上下文：\n\n- 公式中除以时间，说明是每秒运算数。\n- 讨论速度或性能，通常指每秒运算数。\n- 讨论完成任务需要多少计算，通常指总运算量。\n\n### 将 TFLOPS 用作性能指标\n\n优化训练前，需要指标判断吞吐量是否改善。可以测每次迭代秒数、每秒迭代数，但 TFLOPS 是更有用的指标。\n\n它的优势在于，可以判断距离硬件厂商公布的峰值还有多远，而不仅仅知道某次优化是否更快。\n\n本节以 BLOOM 为例：使用 NVIDIA A100 80 GB，bf16 混合精度。[A100 规格](https://www.nvidia.com/en-us/data-center/a100/)写道：\n\n```\nBFLOAT16 Tensor Core \t312 TFLOPS\n```\n\n因此，如果只对特定形状的巨大 bf16 矩阵执行 `matmul`，不包含设备间复制，理论最高约 312 TFLOPS。\n\n实际还有磁盘 I/O、通信、GPU 显存到计算单元的数据搬运，而且不能全部使用 bf16，有时必须 fp32 或 tf32，因此预期应低得多。不同加速器不同；2022 年，384 块 A100 的复杂训练能持续超过 50%，约 155 TFLOPS，已经非常出色。\n\n补充说明：2023 年 FlashAttention 等技术进一步将水平推高到 50% 以上。\n\n我们刚开始调优时不到 100 TFLOPS，几周后正式启动训练时达到 150 TFLOPS。\n\n关键是，我们知道继续提升的空间已经不大，没必要无限优化。\n\n因此，准备大规模训练时，可以先打听指定加速器、精度、多节点环境下通常能达到的最佳 TFLOPS，优化到接近它，然后停止调优，开始训练。\n\n补充说明：80 GB A100 在 2022 年约为 155 TFLOPS，2023 年约提高到 180 TFLOPS。\n\n补充说明：启用[梯度检查点](#gradient-checkpointing)后，额外计算必须计入 TFLOPS。通常相当于多一次前向，但近期更好的方法可以减少部分重计算。\n\n解码器 Transformer 可用下式估计，结果会略低于真实 TFLOPS：\n\nTFLOPS：`model_size_in_B * 4 * 2 * seqlen * global_batch_size / (time_in_sec_per_iteration * total_gpus * 1e3)`\n\n启用激活／梯度检查点时因子为 4，否则为 3。100B 以上模型几乎总会启用激活检查点。\n\n因此，`3*2` 常称为“模型 FLOPs”，`4*2` 称为“硬件 FLOPs”，分别对应 MFU、HFU：每秒模型或硬件浮点运算数除以加速器理论峰值。\n\n```bash\nperl -le '$ng=64; $ms=52; $gbs=1024; $sp=127; $seqlen=2048; print $ms*4*2*$seqlen*$gbs / ( $sp * $ng * 1e3)'\n```\n\n其中 ng 为 GPU 总数，ms 为以十亿计的模型参数量，gbs 为全局批量，sp 为每次迭代秒数。\n\n下面用 Bash 环境变量表示同一公式，将 GBS 拆为 `MBS*DP*GAS`。这里 GAS 对应流水线块数 `pp_chunks`，通常它表示梯度累积步数。\n\n```bash\necho \"($MSIZE*4*2*SEQLEN*$MICRO_BATCH_SIZE*$DP_SIZE*$GAS)/($THROUGHPUT*$NNODES*$GPUS_PER_NODE*1000)\" | bc -l\n```\n\n`$GPUS_PER_NODE` 为每节点加速器数，因此 `$NNODES*$GPUS_PER_NODE` 为 GPU 总数，对应 Perl 中的 `$ng`。\n\n精确公式位于[使用 Megatron-LM 在 GPU 集群上高效训练大规模语言模型](https://arxiv.org/abs/2104.04473)第 5.1 节公式 3，代码见[这里](https://github.com/bigscience-workshop/Megatron-DeepSpeed/pull/251)。\n\n补充说明：只做推理时，每层浮点运算量为 `24Bsh^2 + 4Bs^2h`。\n\n#### 自动计算 FLOP\n\n手工计算容易出错，许多公式本身有误，不同模型和配置行为也不同，因此跨架构准确计数很难。PyTorch 团队开发了自动测量方法：\n\n```python\nfrom torch.utils.flop_counter import FlopCounterMode\n\nflop_counter = FlopCounterMode(mods=model, display=False, depth=None)\nwith flop_counter:\n    model(**input).sum().backward()\ntotal_flops =  flop_counter.get_total_flops()\n```\n\n这样理论上就自动得到 FLOPs。不过实践中，`FlopCounterMode` 存在影响性能和显存的多个问题，截至 2026 年 8 月还不能可靠替代手算。仍需前面的公式，将计数器作为交叉检查，而非最终答案。\n\n我只在第二次迭代运行它，因为第一次可能有只执行一次的额外计算。除非迭代行为会变化，否则缓存结果即可，无需反复计算。\n\n然后测每次迭代耗时，用 FLOPs 除以秒数和 `1e12`：\n\n```\ntflops = total_flops / time / 1e12\n```\n\n每次迭代的数值会略有变化。\n\n### MFU 与 HFU\n\nMFU 和 HFU 估计模型前向、反向期间硬件的利用情况，其中包括同步网络开销，也可能包括 DataLoader I/O。\n\n```\nMFU = Estimated_Achieved_FLOPS / Theoretical_FLOPS\nHFU = Actual_Achieved_FLOPS / Theoretical_FLOPS\n```\n\nHFU 统计实际 FLOPS。例如，[梯度检查点／激活重计算](#gradient-checkpointing)会重复全部或部分前向，实际执行更多浮点运算。MFU 则忽略实现细节，只计理论所需计算，因此对实际硬件运算的描述不如 HFU 精确。\n\n[减少大型 Transformer 模型中的激活重计算](https://arxiv.org/abs/2205.05198)很好地解释了这些概念。\n\n`Theoretical_FLOPS` 来自官方规格，高端加速器数值见[这里](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator/README.md#tflops-comparison-table)。例如 H100 的 BF16 理论峰值为 989 TFLOPS。\n\n假设实际训练循环测得 400 TFLOPS，则：\n\n```\nHFU = 400/989 = 40%\n```\n\n没有激活重计算时，HFU 与 MFU 相同；使用时，MFU 低于 HFU，因为前者只统计理论前向／反向，后者还统计重计算。\n\n例如，[Megatron-LM](https://github.com/NVIDIA/Megatron-LM) 发布了 A100-80GB 的以下结果：\n\n| 模型规模 | MFU | HFU |\n| :---: | :---: | :---: |\n| 22B | 41.5% | 43.7% |\n| 175B | 51.4% | 52.8% |\n| 530B | 56.0% | 57.0% |\n| 1T | 56.3% | 57.0% |\n\n因为使用激活重计算，所以 MFU \u003c HFU。\n\n更新的 H100、A100 数据见[这里](https://github.com/mosaicml/llm-foundry/tree/main/scripts/train/benchmarking#mfu-and-hfu)。\n\n比较他人公布的 MFU／HFU 前，必须确认 FLOPS 计算方式相同。理论峰值固定，变化的是实际 FLOPS；多数时候它根据参数形状估算，而不同公式有的略不准确，有的误差很大。编译器也可能优化掉一些操作，改变实际 FLOPs；迭代时间如何测量通常也不清楚。\n\n回顾 `TFLOPS = FLOS / iteration_duration`，公平比较要问：\n\n1. 总浮点运算量是否按相同方式计算？\n2. 时间是否连续覆盖整次迭代，包含 DataLoader 和日志，还是只测前向+反向？\n\n任一不一致，都不能公平比较。\n\n遗憾的是，多数论文和博客只报告 MFU，不链接计算方法。\n\n不过，若难以与竞争结果比较，记住这些测量口径差异不会改善最终吞吐量。只要自己始终采用同一方法，就能立即看出性能改善或退化；对你而言，相对变化最重要。\n\n#### MFU 是非常粗略的近似\n\n大部分训练／微调使用混合精度，但 MFU／HFU 分母采用最快格式的计算能力。例如 BF16 混合精度有些部分使用 FP32，却按全部 BF16 计算，当然不准确。理想上应分段测量并考虑各自格式。这个近似之所以尚可，是因为低精度计算通常占主导。\n\n此外，存储和网络 I/O 深度参与训练，不同集群即使软件相同，也会得到不同 MFU。因此，可以比较自己的配置优化前后，却很难直接比较不同团队、不同集群的 MFU。\n\n## 如何提速并节省显存\n\n能够用于批量大小 BS 的显存越多，GPU 计算通常越高效，处理数据越快，任务也越早完成。\n\n如果 BS=1 都 OOM，又不想租买更多硬件，本节尤其重要。\n\n各功能的作用概览：\n\n| 方法 | 提速 | 节省显存 |\n| --- | --- | --- |\n| 梯度累积 | 是 | 是 |\n| 梯度检查点 | 否* | 是 |\n| 混合精度训练 | 是 | 否 |\n| 批量大小 | 是 | 是 |\n| 优化器选择 | 是 | 是 |\n| DataLoader | 是 | 否 |\n| DeepSpeed ZeRO | 否 | 是 |\n| FlashAttention | 是 | 是 |\n\n\\* 固定批量下，梯度检查点会减速；但释放大量显存后，能使用大得多的批量，因此整体速度反而可能提高。\n\n### 模型运算构成\n\nTransformer 的操作按计算强度可分三类：\n\n1. **张量收缩**：线性层和多头注意力组件执行批量矩阵—矩阵乘法，是训练中计算最密集的部分。\n2. **统计归一化**：Softmax 和 LayerNorm 比张量收缩计算强度低，包含一次或多次归约，再通过映射应用结果。\n3. **逐元素算子**：偏置、dropout、激活函数、残差连接，计算强度最低。\n\n理解这些有助于分析性能瓶颈。\n\n这一概述来自 [Data Movement Is All You Need: A Case Study on Optimizing Transformers 2020](https://arxiv.org/abs/2007.00072)。\n\n### 模型显存占用构成\n\n训练显存远多于仅将模型放到 GPU，因为以下组件都占显存：\n\n1. 模型权重。\n2. 优化器状态。\n3. 梯度。\n4. 为梯度计算保存的前向激活。\n5. 临时缓冲区。\n6. 特定功能所需内存。\n\n典型 AdamW 混合精度训练，每参数需要 18 字节，另加激活和临时显存。\n\n具体如下。\n\n**模型权重：**\n\n- fp32 训练：4 字节×参数数。\n- 混合精度：6 字节×参数数，内存中同时保存 fp32 和 fp16／bf16 模型。\n\n**优化器状态：**\n\n- 普通 AdamW：8 字节×参数数，维护两份状态。\n- bf16 AdamW：4 字节×参数数，参见使用 `AnyPrecisionAdamW` 的[这项工作](https://github.com/huggingface/transformers/pull/21312)。\n\n- 带动量 SGD、LION、Adafactor 等优化器：4 字节×参数数，只维护一份状态；Adafactor 在这 4 字节之外还需要一些额外内存。\n- [bitsandbytes](https://github.com/bitsandbytes-foundation/bitsandbytes) 等 8 位 AdamW：2 字节×参数数。\n\n**梯度：**\n\n- fp32，以及某些框架的混合半精度训练：4 字节×参数数。\n- 非混合半精度，以及某些框架的混合半精度训练：2 字节×参数数。\n\n**前向激活：**\n\n- 大小取决于许多因素，主要是序列长度、隐藏维度和批量大小。\n\n这里包含前向、反向函数传入和返回的输入输出，以及为梯度计算保存的前向激活。\n\n每 GPU 激活显存可粗略拆为：\n\n1. 激活工作显存：`dtype_size * num_of_hidden_states_copies * bs * seqlen * hidden_size`\n2. 激活检查点显存：`dtype_size * num_layers * bs * seqlen * hidden_size`\n3. logits 工作显存：`fp32_size * bs * seqlen * vocab_size`\n\n以下计算中：\n- `dtype_size`：数据类型单元素字节数，如 fp8 为 1、bf16 为 2、fp32 为 4，完整列表见[张量精度／数据类型](training--dtype.html)。\n- `fp32_size`：4 字节。\n- `bs`：批量大小。\n- `hidden_size`：模型隐藏维度。\n- `seqlen`：序列长度。\n- `num_layers`：层数。\n- `vocab_size`：词表大小。\n\n`dtype_size * bs * seqlen * hidden_size` 就是 `hidden_states` 张量大小，等于形状 `[bs, seqlen, hidden_size]` 乘以每元素字节数。\n\n下面以 Llama-3 架构的 [8B 配置](https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct/blob/main/config.json)为例：\n\n```\nhidden_size=4096\nnum_layers=32\nvocab_size=128256\n```\n\n并使用：\n\n```\ndtype=bf16 (2 bytes)\nbs=1\nseqlen=32768\n```\n\n立即可得 bf16 `hidden_states` 大小：`2 * 1 * 32768 * 4096 / 2**30 = 0.25GiB`。\n\n第 1 部分：计算单层前向所需工作显存：\n\n`activation_memory_per_layer = num_of_hidden_states_copies * dtype_size * bs * seqlen * hidden_size`\n\n`num_of_hidden_states_copies` 通常为 20–50，随架构变化。用 [activation-memory-per-layer.py](../source-assets/training/performance/benchmarks/activation-memory-per-layer.py) 测几个模型，结果为：\n\n```\n24.0 \"HuggingFaceTB/SmolLM2-360M\"\n28.0 \"meta-llama/Llama-3.1-8B-Instruct\"\n28.0 \"mistralai/Mistral-7B-Instruct-v0.3\"\n29.8 \"deepseek-ai/DeepSeek-R1-0528-Qwen3-8B\"\n38.0 \"Qwen/Qwen3-4B\"\n48.0 \"google/gemma-1.1-2b-it\"\n```\n\n可见，单层前向中 Gemma 所需 `hidden_states` 副本数是 SmolLM2 的两倍。\n\n`hidden_size` 不同时，直接比较显存困难，但比较副本数系数很容易。\n\n有些架构还分配其他内存，例如 `deepseek-ai/DeepSeek-R1-0528-Qwen3-8B` 的系数不是整数。\n\n回到示例：\n\n`activation_memory_per_layer = 2 * 28 * 1 * 32768 * 4096 / 2**30 = 7GiB`，28 来自上面 Llama-3.1-8B-Instruct 的测量。\n\n第 2 部分：知道单层显存后，取决于是否启用[梯度检查点](#gradient-checkpointing)，有两种情况：\n\n- 启用时，保存 `num_layers * hidden_states`。示例为 `32 * 0.25 = 8GiB`。\n- 不启用时，激活显存增长到 `num_layers * activation_memory_per_layer`。示例为 `32 * 7 = 224GiB`。\n\n8 GiB 对 224 GiB，差异极大，因此即使需要额外重算一次前向，大家仍会启用[梯度检查点](#gradient-checkpointing)。\n\n第 3 部分：损失计算通常显式生成 fp32 logits，词表往往是最大维度，因此大小为 `fp32_size * bs * seqlen * vocab_size`。\n\n示例为 `4 * 1 * 32768 * 128256 / 2**30 = 15.7GiB`，约 16 GiB。\n\nlogits 比该模型全部激活检查点占用还大。\n\n实际中系数往往是 6 而不是 4，因为通常先生成低精度 logits，再转为 fp32，两份同时存在，即 `2+4=6`。\n\n第 4 部分：启用检查点时，总激活显存为单层前向工作显存、激活检查点和 logits 之和；未启用时，为全部前向激活加 logits。\n\n示例：\n\n- 启用：`7 + 8 + 16 = 31GiB`。\n- 未启用：`224 + 16 = 240GiB`。\n\n**临时显存：**\n\n各种临时变量计算后会释放，但峰值时也会额外占用，触发 OOM。因此写代码时应统筹考虑，必要时在不用后立即显式释放。\n\n**特定功能显存：**\n\n软件还可能有特殊需求，例如 beam search 生成文本时，需要保存多份输入输出。\n\n**推理**的计算类似，但去掉优化器状态和梯度，权重只需参数数乘以：\n\n- fp32：4 字节。\n- fp16／bf16：2 字节。\n- fp8／int8：1 字节。\n- fp4／int4：0.5 字节。\n\nfp8、fp6、fp4、整数量化和 MX 等格式，参见[推理章节的模型权重](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/inference/README.md#model-weights)。\n\n[Transformer Math 101](https://blog.eleuther.ai/transformer-math/)也详细介绍显存及其他需求。\n\n[EAI cookbook](https://github.com/EleutherAI/cookbook) 提供一组[计算脚本](https://github.com/EleutherAI/cookbook/tree/main/calc)，根据配置估计训练或推理的理论内存开销。\n\nAlexander Smirnov 的 [GPU VRAM Estimator](https://vram.asmirnov.xyz/) 也很方便，另有[原理说明](https://asmirnov.xyz/vram)。\n\n### 其他 GPU 显存占用\n\n除上述部分外，还有其他显存使用者，因此模型永远无法使用全部标称显存。\n\n#### 预加载 CUDA 内核的显存占用\n\nPyTorch 首次使用 CUDA 时，可能占用 0.5–2 GiB，减少总可用显存，而且 torch 显存分析器不会统计这部分。\n\n不同 GPU、PyTorch 版本占用不同。下面只创建一个 4 字节 CUDA 张量，观察初始化占用。\n\n`pytorch==1.10.2`：\n\n```bash\n$ CUDA_MODULE_LOADING=EAGER python -c \"import torch; x=torch.ones(1).cuda(); free, total = map(lambda x: x/2**30, torch.cuda.mem_get_info()); \\\nused=total-free; print(f'pt={torch.__version__}: {used=:0.2f}GiB, {free=:0.2f}GiB, {total=:0.2f}GiB')\"\npt=1.10.2: used=1.78GiB, free=77.43GiB, total=79.21GiB\n```\n\n`pytorch==1.13.1`：\n\n```bash\n$ CUDA_MODULE_LOADING=EAGER python -c \"import torch; x=torch.ones(1).cuda(); free, total = map(lambda x: x/2**30, torch.cuda.mem_get_info()); \\\nused=total-free; print(f'pt={torch.__version__}: {used=:0.2f}GiB, {free=:0.2f}GiB, {total=:0.2f}GiB')\"\npt=1.13.1: used=0.90GiB, free=78.31GiB, total=79.21GiB\n```\n\n旧版在 A100 上“占掉”1.78 GiB，新版仅 0.9 GiB；省下约 0.9 GiB，可能正好避免 OOM。\n\n但不要认为这是单向下降趋势。它取决于具体 PyTorch、CUDA 版本如何打包和加载内核，版本间可能增减：1.10.2→1.13.1 几乎减半，到下面的 2.1.1 又略升。这些 2022–2023 年数据保留在这里，是说明仅换版本，同 GPU 就可能相差近 1 GiB。它们只是现象示例，不应拿来规划容量；应在自己的 GPU、PyTorch、CUDA 组合上运行命令测量。\n\n较新 PyTorch 中，`CUDA_MODULE_LOADING=EAGER` 强制预加载，否则按需延迟加载。生产中不要这样设置，因为可能加载不必要的内核，浪费显存；延迟加载的目的就是只加载需要的内核。\n\n`pytorch==2.1.1`：\n\n```bash\n$ CUDA_MODULE_LOADING=EAGER python -c \"import torch; x=torch.ones(1).cuda(); free, total = map(lambda x: x/2**30, torch.cuda.mem_get_info()); \\\nused=total-free; print(f'pt={torch.__version__}: {used=:0.2f}GiB, {free=:0.2f}GiB, {total=:0.2f}GiB')\"\npt=2.1.1+cu121: used=0.92GiB, free=78.23GiB, total=79.15GiB\n```\n\n相比之下，延迟加载模式：\n\n```bash\n$ python -c \"import torch; x=torch.ones(1).cuda(); free, total = map(lambda x: x/2**30, torch.cuda.mem_get_info()); \\\nused=total-free; print(f'pt={torch.__version__}: {used=:0.2f}GiB, {free=:0.2f}GiB, {total=:0.2f}GiB')\"\npt=2.1.1+cu121: used=0.47GiB, free=78.68GiB, total=79.15GiB\n```\n\n相差约 450 MiB，但这里只加载了 `torch.ones` 所需内核。真实程序调用更多 API 后，占用会位于 0.47–0.92 GiB 之间。\n\n#### `torch.distributed` 的显存占用\n\n使用 `torch.distributed`，仅初始化就可能占约 1–2 GiB；GPU 越多，占用越高，不同后端也不同，而且 torch 显存分析器不会统计它。\n\n[torch-dist-mem-usage.py](../source-assets/training/performance/distributed/torch-dist-mem-usage.py) 展示实际占用：\n\n```bash\n$ python -u -m torch.distributed.run --nproc_per_node=2 --rdzv_endpoint localhost:6000  --rdzv_backend c10d \\\ntorch-dist-mem-usage.py\n[...]\n[0] mp: before barrier\n[0] mp: MA 0.00 GiB | Max_MA 0.00 GiB | CA 0.00 GiB | Max_CA 0.00 GiB | NV 0.55 GiB | CPU Virtual Memory:  used = 68.79 GiB, percent = 3.4%\n[0] mp: after barrier\n[0] mp: MA 0.00 GiB | Max_MA 0.00 GiB | CA 0.00 GiB | Max_CA 0.00 GiB | NV 2.00 GiB | CPU Virtual Memory:  used = 69.33 GiB, percent = 3.5%\n[0] mp: after 2nd barrier\n[0] mp: MA 0.00 GiB | Max_MA 0.00 GiB | CA 0.00 GiB | Max_CA 0.00 GiB | NV 2.00 GiB | CPU Virtual Memory:  used = 69.33 GiB, percent = 3.5%\n[0] mp: after dist destroy\n[0] mp: MA 0.00 GiB | Max_MA 0.00 GiB | CA 0.00 GiB | Max_CA 0.00 GiB | NV 1.28 GiB | CPU Virtual Memory:  used = 69.25 GiB, percent = 3.5%\n[0] mp: after dist destroy\n[0] mp: MA 0.00 GiB | Max_MA 0.00 GiB | CA 0.00 GiB | Max_CA 0.00 GiB | NV 1.28 GiB | CPU Virtual Memory:  used = 69.25 GiB, percent = 3.5%\n```\n\n可见，[CUDA 内核](#preloaded-cuda-kernels-memory-usage)先占 0.55 GiB，第一次 `dist.barrier` 再占约 1.5 GiB。如果 `init_process_group` 传入 `device_id`，额外分配会移到初始化调用，barrier 的新增占用则减少。\n\n#### 如何选择 `nccl`、`nccl2` 与 `nccl-lazy`\n\n从 PyTorch 2.14 开始，分布式包在同一 NCCL 库之上提供第二套实现。`nccl2` 并不代表 NCCL 版本 2，也不替换 NCCL 集体通信算法；它改变的是 PyTorch 如何创建、拆分、等待和中止通信器。2.14 中 `init_process_group(\"nccl\")` 仍选择原有 `ProcessGroupNCCL`。显式使用 `backend=\"nccl2\"`，或设置 `TORCH_DIST_USE_NCCL2=1`，才会采用新实现。`nccl-legacy` 始终选择旧实现；`nccl-lazy` 是 nccl2 的变体，在首次访问某个 peer 时创建通信器，而非提前创建。\n\n空闲 8×H200 节点上，PyTorch 2.14.0、CUDA 13.0、NCCL 2.30.7，1 GiB `all_reduce` 两者 `busbw` 都在 458–466 GBps。同一实现重复测试的波动与两者差距一样大，因此没有显示吞吐量差异，它们调用的 NCCL 集体通信相同。\n\n可测的差异在显存：初始化和首次 barrier 后，rank 0 在 nccl 下占 1.56 GiB，在 nccl2 下占 5.16 GiB。多次复现，是否传入 `device_id` 都一样。因此，不要为期待更快通信而切换，采用前应测自己的拓扑显存成本。nccl2 提供的是通信器生命周期控制：`new_group` 时即建立子组，而非等首次通信；还可通过 2.14 标为不稳定的 API，在 rank 故障后原地重建组，无需重启。\n\n`nccl-lazy` 适合每个 rank 只与少量 peer 通信的情况，例如[流水线并行](training--model-parallelism--README.html#pipeline-parallelism)，从不使用的通信器就不创建。如果进程组从第一步起就执行集体通信，通信器最终都要建立，因此不会降低峰值显存。\n\n参考：[PyTorch 2.14 发布博客](https://pytorch.org/blog/pytorch-2-14-release-blog/)。\n\n#### 显存碎片\n\n模型不断分配和释放张量，可能产生碎片。例如总空闲量足够分配连续 1 GiB，但分散在数百个小片段中，除了很小的分配外无法使用。\n\n`PYTORCH_ALLOC_CONF` 可以调整默认分配机制，详情见[内存管理](https://docs.pytorch.org/docs/stable/notes/cuda.html#memory-management)。当代码频繁改变张量形状、容易严重碎片化时，我发现 `PYTORCH_ALLOC_CONF=expandable_segments:True` 非常有帮助。\n\n### 批量大小\n\n通常有两种批量：\n\n1. 微批量 MBS，也称每 GPU 批量，是单 GPU 在一次 `forward` 中处理的样本数。\n2. 全局批量 GBS，是所有参与 GPU 在两次优化器更新之间总共处理的样本数。\n\n一个模型副本需要多少 GPU，取决于装下完整模型所需资源。\n\n- 模型能装入单 GPU，副本占一块，通常可用多 GPU 执行[数据并行](training--model-parallelism--README.html#data-parallelism)。\n- 装不下时，需要[张量并行](training--model-parallelism--README.html#tensor-parallelism)、[流水线并行](training--model-parallelism--README.html#pipeline-parallelism)或 [ZeRO 数据并行](training--model-parallelism--README.html#zero-data-parallelism)等分片。\n\n副本数对应可用数据流数，也就是 DP。\n- 单卡可容纳模型时，数据流数等于 GPU 数，DP=N_GPUS。\n- 三维并行时，`DP=N_GPUs/(TP*PP)`；ZeRO 并行时，DP=ZeRO-DP。\n\n全局批量为：\n\n```\nGBS = MBS*DP\n```\n\n例如 8 块 GPU、MBS=4，使用 DP，则：\n\n```\nGBS = MBS*DP = 4*8 = 32\n```\n\n如果 TP=2、PP=2，每个副本占 4 块 GPU（`TP*PP`），总 GPU 数为 8，则：\n\n```\nDP = N_GPUS/(TP*PP) = 8 / (2*2) = 2\n```\n\n此时 GBS 为：\n\n```\nGBS = MBS*DP = 4*2 = 8\n```\n\n使用[梯度累积](#gradient-accumulation)时，通常还定义累积多少步再同步，称为 GAS。若 GAS=4，每四步同步一次梯度，TP=1、PP=1、DP=8：\n\n```\nDP = N_GPUS/(TP*PP) = 8 / (1*1) = 8\nGBS = MBS*DP*GAS = 4*8*4 = 128\n```\n\n通常应让微批量尽可能大，使显存接近占满，但留有余量。\n\n大模型剩余显存少，因此多装入一个样本也很重要。\n\n序列长度、隐藏维度等最好是较大的 2 的倍数，例如 64、128，以获得最佳性能；但多数模型计算时会合并批量与序列维度，所以微批量自身的对齐通常影响很小，甚至没有影响。\n\n因此，MBS=8 会 OOM、7 可以，就用 7，而不是退到 4。批量越大，单步处理的样本越多。\n\n当然，使用数百块 GPU 时，全局批量可能过大。这时可以减小微批量、减少 GPU，或改用其他数据并行形式，让 GPU 更高效。\n\n### 梯度累积\n\n梯度累积不是一次计算整个批量的梯度，而是拆成较小批量，逐次执行前向和反向并累加梯度，积累足够后再执行优化器更新。这样可以获得远超单卡显存容量所能容纳的总批量，但额外的前向、反向调用也可能略微减速。\n\nGAS 定义的是不更新模型权重、连续累积多少步。\n\n使用流水线并行时，通常必须采用较大的 GAS，以[尽量缩小流水线气泡](training--model-parallelism--README.html#naive-model-parallelism-vertical)。\n\n优化器更新频率降低，也能额外提速。\n\n以下测试显示，提高 GAS 可以让整体吞吐量提升 20–30%：\n\n- [RTX-3090](https://github.com/huggingface/transformers/issues/14608#issuecomment-1004392537)\n- [A100](https://github.com/huggingface/transformers/issues/15026#issuecomment-1005033957)\n\n[数据并行](training--model-parallelism--README.html#data-parallelism)中，梯度累积还能减少梯度归约次数。常用 `all_reduce` 的通信量约为梯度大小的两倍。例如 DDP 从 GAS=1 改为 GAS=8，网络开销减少 8 倍，慢节点间网络上可明显提高吞吐量。\n\n### 梯度检查点\n\n**Gradient Checkpointing** 也称 **Activation Recomputation（激活重计算）**或 **Activation Checkpointing（激活检查点）**。\n\n它只适用于训练，不用于推理。\n\n启用后，用训练吞吐量换取显存。不再一直保存 Transformer 块等输出直到反向完成，而是提前丢弃，释放大量显存；反向需要前向输出时，再重新计算。\n\n不同模型有所差异，通常固定批量下吞吐量下降约 20–25%，但释放显存后可以增大每 GPU 批量，整体有效吞吐量反而提高。有时批量可翻倍或扩大到四倍。近期论文也报告高达 30–40% 的额外开销。\n\nHF Transformers 模型中，自定义 Trainer 可以调用 `model.gradient_checkpointing_enable()`；使用 HF Trainer 则传入 `--gradient_checkpointing 1`。\n\n另参见[减少大型 Transformer 模型中的激活重计算](https://arxiv.org/abs/2205.05198)，它介绍了避免大部分重计算、同时节省显存和计算的方法。\n\n### 节省显存的优化器\n\n最常见的 Adam 及其变体，每参数状态占 8 字节，即两份 fp32 张量，几乎占模型、优化器和梯度总分配的一半。有时换优化器能解决容量问题，前提是它能成功训练；并非所有优化器适合所有任务。\n\n4 字节优化器：\n\n- Adafactor 等只需约 4 字节，[LION](https://arxiv.org/abs/2302.06675) 也是如此。\n- `AnyPrecisionAdamW`：一些人尝试整个训练都用 BF16，而不是混合精度，优化器状态每参数只需 4 字节，见[这项工作](https://github.com/huggingface/transformers/pull/21312)。需要 Kahan 求和或随机舍入，参见 [Revisiting BFloat16 Training（2020）](https://arxiv.org/abs/2010.06192)。权重、优化器状态和梯度总共只要每参数 8 字节，而非 18！\n\n2 字节优化器：\n\n- `bnb.optim.Adam8bit` 等量化方案，用 2 字节代替 8 字节，每个动量 1 字节。[这里](https://github.com/bitsandbytes-foundation/bitsandbytes)可以获取。安装后，HF Trainer 只需传 `--optim adamw_bnb_8bit`。\n\n速度比较见[基准测试](https://github.com/huggingface/transformers/issues/22101)。原文指出，`apex.optimizers.FusedAdam` 是最快的 Adam 实现；PyTorch 2.0 起，[torch.optim.AdamW](https://docs.pytorch.org/docs/stable/generated/torch.optim.AdamW.html) 支持 `fused=True`，性能已接近它。\n\n## 模型执行速度\n\n### 前向与反向的速度\n\n卷积和线性层的反向 FLOPs 约为前向两倍，因此通常慢约两倍，有时更慢，因为反向形状往往不够理想。激活函数通常受带宽限制，反向读取也更多：前向读一次、写一次，反向读 `gradOutput` 和前向输出两次，再写 `gradInput` 一次。\n\n### 输入数据会影响测得的速度\n\n单步耗时不仅取决于张量形状，也取决于*数值*。高熵输入每周期翻转更多晶体管，功耗更高，可能在相同功耗／温度限制下拉低 boost 频率；低熵或全零输入则不会，因此相同形状、相同内核也可能耗时不同。训练或推理基准应为输入 RNG 设置种子，如 `torch.manual_seed(...)`，并使用真实分布，而不是全零。分布固定后影响较小，但并非零。功耗、非正规数机制和引用详见[输入数据影响实测性能](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator/benchmarks/README.md#input-data-affects-measured-performance)。这里讨论的是计时条件；数值确定性见[可复现性](training--reproducibility--README.html)。\n\n## 向量与矩阵尺寸的整除性\n\n[模型架构与硬件协同设计的必要性](https://arxiv.org/abs/2401.14489)研究了 Transformer 尺寸对硬件性能的影响。[配套脚本](https://github.com/EleutherAI/cookbook/tree/main/benchmarks/sizing)可用于非 V100／A100 硬件的自行测试。\n\n批量和输入／输出神经元数量能被特定数整除时，性能最高。通常从 8 开始，也可能更大，取决于硬件和数据类型。\n\n对于对应 GEMM 的全连接层，NVIDIA 提供了[输入／输出神经元数量](https://docs.nvidia.com/deeplearning/performance/dl-performance-fully-connected/index.html#input-features)和[批量大小](https://docs.nvidia.com/deeplearning/performance/dl-performance-fully-connected/index.html#batch-size)建议。\n\n[Tensor Core 要求](https://docs.nvidia.com/deeplearning/performance/dl-performance-matrix-multiplication/index.html#requirements-tc)按类型和硬件规定倍数。例如 fp16 一般建议 8 的倍数，A100 却推荐 64！\n\n小尺寸还需考虑[维度量化效应](https://docs.nvidia.com/deeplearning/performance/dl-performance-matrix-multiplication/index.html#dim-quantization)：分块时选择正确倍数，可明显提速。\n\n[上述论文](https://arxiv.org/abs/2401.14489)详细讨论 tile／wave 量化及注意力头数，关键内容如下。\n\n### Tile 与 wave 量化\n\n记号：\n\n- `a`：注意力头数。\n- `h`：隐藏维度。\n- `s`：序列长度。\n- `b`：微批量。\n- `t`：张量并行度。\n\n先介绍背景。\n\nNVIDIA GPU 把输出矩阵分成多个 tile，调度到可用 SM，例如 A100 有 108 个。每个 tile 或线程块利用 Tensor Core 执行。Tensor Core 为高速张量运算设计，需要适当的 GEMM 维度。V100、A100 上，m、k、n 对应字节数分别为 16、128 的倍数时，能充分利用 Tensor Core。FP16 每元素 2 字节，因此分别对应 8、64 个元素的倍数。无法满足时，更大的 2 字节倍数通常也更好。\n\n![矩阵分块](../source-assets/training/performance/images/tiling.png)\n\n内核可选择多种 tile 大小。若 GEMM 尺寸不能整除 tile，线程块仍须完整执行，但部分输出无用，造成浪费。这称为 **tile 量化**，因为输出被量化成离散块。\n\n另一种是 **wave 量化**。线程块调度到 SM 时，每轮可安排的块数取决于 SM 数：A100 为 108，H100／H200 为 132。可用 `torch.cuda.get_device_properties(0).multi_processor_count` 测自己的设备。以 108 为例，109 个块就要两轮：第一轮 108 个，第二轮只有 1 个。第二轮延迟几乎相同，有效计算却很少。矩阵增大时尾轮逐渐填满，吞吐量提高；需要新一轮时，又会下降。\n\n对 Transformer 而言，给定 `h/a`，应尽量处于吞吐量波峰。V100／A100 的相关选择已在 https://arxiv.org/pdf/2401.14489 中研究。\n\n32 个注意力头的例子：\n\n![wave 量化](../source-assets/training/performance/images/wave-quant.png)\n\n`h/a` 中包含更多 2 的因子会有帮助！\n\n### 更多 SM 就意味着更多 TFLOPS 吗？\n\n假设两块加速器在某数据类型下，每 SM 矩阵单元数、每周期 [FMA](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator/README.md#how-to-calculate-theoretical-tflops)、频率都相同，只是 SM 数不同。理论峰值按数量线性增长，因为公式就是 `clock * FMAs_per_clock_cycle_per_compute_unit * 2 * num_compute_units`。最后一项与 SM 数成固定比例，例如 NVIDIA Ampere、Hopper、Blackwell 每 SM 四个 Tensor Core，AMD、Intel 则有自己的单元。这里重要的是比例固定。但实际吞吐量不线性增长，差距来自 wave 量化。\n\nGEMM 分为 C 个线程块，tile 为 `Tm x Tn` 时，`C = ceil(m/Tm) * ceil(n/Tn)`。S 个 SM 需要 `W = ceil(C/S)` 轮。无论一轮是否填满，耗时近似相同，因此时间正比于 W。S1\u003cS2 时，加速比不是 S2/S1，而是：\n\n```\nspeedup = ceil(C/S1) / ceil(C/S2)\n```\n\n曲线因此是台阶，不是直线。例如 B300 至少有 148 和 152 SM 两种 SKU，同芯片、同频率，SM 比为 `152/148`＝**1.027**：\n\n| 线程块数 | 148 SM 轮数 | 152 SM 轮数 | 加速比 | 情况 |\n| ---: | ---: | ---: | ---: | --- |\n| 148 | 1 | 1 | 1.000x | 都一轮，额外 4 个 SM 空闲 |\n| 152 | 2 | 1 | 2.000x | 跨越边界，多 2.7% SM 却快两倍 |\n| 296 | 2 | 2 | 1.000x | 无收益，296 恰好填满两轮 148 |\n| 304 | 3 | 2 | 1.500x | 再次跨越边界 |\n| 3584 | 25 | 24 | 1.042x | 真实 Transformer MLP 形状，见下文 |\n| 50000 | 338 | 329 | 1.027x | 渐近到 SM 比值 |\n\n补充说明：线程块也称 CTA，Cooperative Thread Array。\n\n仅因形状不同，多 2.7% SM 的收益就可能从**没有**到**两倍**。不足一轮时，额外 SM 无事可做；跨越边界时，较少 SM 的设备要多付一轮几乎空载的成本，最多慢两倍。两者轮数相同又打平，此时更多 SM 反而浪费更多：C=296 时，148-SM 恰好两轮填满，152-SM 第二轮有 8 个槽位空闲。只有 C 很大，优势才趋近 SM 比值。3584 时仍差 1.4%，50000 时才在 0.03% 内。这也是厂商用巨型矩阵乘法报峰值的原因：那里台阶才近似平滑。\n\n3584 是真实形状：Llama-3.1-8B 在 8K token 前向中的 MLP 升维投影，hidden_size=4096、intermediate_size=14336，输出为 8192×14336。用 128×256 tile，得到 `64*56=3584` 个块，32 层每层一次。其加速高于 1.027，说明台阶围绕比例上下波动，并非只从下方逼近。\n\n因此，**没有具体形状，SM 数不能直接说明吞吐量优势**。在一种设备上调好的形状，换另一种可能恰好落在不利边界。应计算自己的块数，再除以实际 SM 数。\n\n公布峰值是整块设备总量，不是每 SM：B300 的 bf16 2250 TFLOPS 来自 148 个 SM 合计，每个约 15.2。单轮矩阵乘法受各参与 SM 的速率约束。\n\n**SM 数还随 SKU 变化，所以峰值也应变化。** NVIDIA 完整 GPU 实现为 160 SM，并注明可用 SM 和 HBM 容量随 SKU 不同。类似[缓存表](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator/README.md#caches)中的上一代：完整 GH100 为 144，H100 SXM 为 132。两种实测 B300 都少于完整芯片，一个 B200 SKU 也为 148。将公布数值除以 148，再乘 152：\n\n| 类型 | 公布值 | 每 SM（/148） | 152 SM 时 |\n| --- | ---: | ---: | ---: |\n| bf16 | 2250 | 15.20 | 2311 |\n| fp8 | 4500 | 30.41 | 4622 |\n| mxfp4 | 13500 | 91.22 | 13865 |\n| nvfp4 | 13500 | 91.22 | 13865 |\n\n所有类型都变化 1.027×，因此 NVIDIA 为 B300 SXM 公布一组数字，两种真实 SKU 不可能同时精确匹配。如果 2250 属于 148-SM，则 152-SM 应为 2311；如果属于 152-SM，则 148-SM 只能达到 2191。未注明 SM 数的峰值，对至少一种同名产品只能是近似。理论峰值差 2.7% 是精确比例，实际吞吐量差却是上述台阶，可能无差异、两倍或 2.7%，全由形状决定。\n\n获取 SM 数：\n\n```bash\npython -c \"import torch; p=torch.cuda.get_device_properties(0); print(p.name, p.multi_processor_count)\"\n```\n\n### 注意力头的数量与大小\n\n在不损害精度的前提下，通常应让 `h/a` 尽量大，计算效率更高。[模型架构与硬件协同设计](https://arxiv.org/abs/2401.14489)中的图展示了这一点：\n\n![注意力头](../source-assets/training/performance/images/attention-less-heads.png)\n\n### FlashAttention\n\n使用 [FlashAttention](https://github.com/Dao-AILab/flash-attention) 时，上述 MHA 尺寸约束会被处理。主要要求是 `h/a` 足够大，以充分利用 GPU：\n\n![FlashAttention](../source-assets/training/performance/images/flash-attention.png)\n\n版本与是否使用同样重要，因为各大版本针对不同世代：FA3 对应 Hopper，FA4 对应 Blackwell。新硬件运行旧版本，会闲置新架构功能。本书实测 8B 因果注意力，B200 FA4 对比 H200 FA3，前向+反向在 8K 时 **1.88×**，32K 时 **1.95×**，接近 2.28× 硬件比例，因此注意力不是这次升级的主要瓶颈。完整对比和脚本见 [FA3 对比 FA4](insights--when-to-upgrade-gpus--README.html#worked-example-meta-llamallama-31-8b-training-step-fa3-vs-fa4)。\n\n陷阱在于芯片与内核成熟之间的时间差。完全可用的 FA4 需要数月，上述测试时仍为 beta；此前只能回退 FA2，而它不能利用新架构，在 Blackwell 上很慢。于是，新加速器已经上架，注意力内核却还没准备好。实际可用版本是升级的约束，不是小细节；[软件支持：过早切换的代价](insights--when-to-upgrade-gpus--README.html#software-support-the-cost-of-switching-too-early)将其视为硬门槛。HF Transformers 通过 `attn_implementation` 按设备选择后端，应检查实际选了什么，不要假定最新。\n\n### 基于 SwiGLU 的 MLP\n\nPaLM、LLaMA、Mistral 等使用 SwiGLU 替代更常见的 GLU。\n\nSwiGLU 激活中多一个可学习矩阵，因此 MLP 有 3 个矩阵而非原来的 2 个。为保持参数总量，[SwiGLU 论文](https://arxiv.org/abs/2002.05202)建议用 `dim_mlp = 8/3*dim_attn`，替代常见的 `4*dim_attn`。[模型架构与硬件协同设计](https://arxiv.org/abs/2401.14489)建议选择合适隐藏维度 h 获得最佳矩阵乘法，但直接用 `8/3*h` 可能破坏所有对齐，让 MLP 明显变慢。\n\n解决方法是认识到 8/3 只是建议，可以选择附近让矩阵形状更好的系数。公开 Llama-2 7B 的系数为 `11008/4096=2.6875`，接近 `8/3=2.667`；70B 则为 `28672/8192=3.5`，其 MLP 参数甚至明显多于典型非 SwiGLU Transformer 块。\n\n既然系数不必精确，且 h 已选好，就可以在附近搜索高性能 GEMM 形状。穷举显示，Llama-2-7B 的中间维度确实是附近最佳选择之一。\n\n[swiglu-maf-bench.py](../source-assets/training/performance/benchmarks/matrix-shape/swiglu-maf-bench.py) 很容易适配，在真实训练目标硬件运行后，就能找到最佳 MLP 隐藏维度。\n\nH100、h=4096 的结果：\n\n```bash\n./swiglu-maf-bench.py\nWanted the closest to 10922 d_ff value that leads to the highest TFLOPS (d_hidden=4096)\n\nSearching 50 steps in the range of 10822 .. 11022\nResults: baseline, followed by near-by best performing d_ff results:\n\n d_ff  tflops mlp_params\n-------------------------\n10922  272.73 134209536\n-------------------------\n10944  398.38 134479872\n10848  395.62 133300224\n10880  395.52 133693440\n10912  395.16 134086656\n11008  395.01 135266304\n```\n\n`8/3*4096=10922` 性能较差，只增加 22 到 10944，矩阵乘法就快 46%。输出还列出 MLP 参数数，方便按参数预算选择略慢但更合适的尺寸。\n\n### 模型尺寸的最终建议\n\n1. 词表大小能被 64 整除。\n2. 微批量尽可能大。\n3. `b*s`、`h/a`、`h/t` 应能被某个 2 的幂整除。\n4. `(b*a)/t` 应为整数。\n5. t 尽量小。\n6. SwiGLU 在 `8/3*h` 附近搜索性能最好的隐藏维度。\n\n### 延伸阅读\n\n- [矩阵乘法喜欢什么形状？](https://www.thonking.ai/p/what-shapes-do-matrix-multiplications)\n\n## NUMA 亲和性\n\n[非一致性内存访问（NUMA）](https://en.wikipedia.org/wiki/Non-uniform_memory_access)是多处理器内存设计，访问时间取决于内存相对处理器的位置。现代服务器有多个 CPU，因此驱动加速器的进程应绑定到与该加速器相同的 NUMA 节点，以获得最佳性能。\n\n先理解 NUMA 节点代表什么。\n\n典型 8×A100 服务器拓扑：\n\n![A100 服务器 NUMA 节点](../source-assets/training/performance/images/a100-server-hwloc.png)\n\n它有两个 CPU，各定义一个 NUMA 区域，每个区域连接四块 GPU。图中灰色 `CoProc` 块就是 GPU，标有 108 个 SM 和 79 GiB 显存。\n\n补充说明：图片由 [hwloc](https://github.com/open-mpi/hwloc) 的 `lstopo a100.png` 生成。\n\n使用超线程时，执行 `lstopo -l`，可正确显示逻辑核心编号。例如两个 NUMA 节点、8 块加速器、104 个物理核、208 个逻辑核，即每 GPU 26 个超线程逻辑核（`208/8=26`）。原文列出的核心示例为：\n\n- gpu0..3：`[0, 1, 2, 3, ..., 51, 104, 105, 106, ..., 129]`\n- gpu4..7：`[52, 53, 54, ..., 103, 156, 157, 158, ..., 207]`\n\n编号先列物理核心，再列其余超线程核心，因此会有跳跃。\n\nNVIDIA 节点还可以用：\n\n```bash\n$ nvidia-smi topo -m\n        GPU0    GPU1    GPU2    GPU3    GPU4    GPU5    GPU6    GPU7    CPU Affinity    NUMA Affinity\nGPU0     X      NV18    NV18    NV18    NV18    NV18    NV18    NV18    0-51,104-155    0\nGPU1    NV18     X      NV18    NV18    NV18    NV18    NV18    NV18    0-51,104-155    0\nGPU2    NV18    NV18     X      NV18    NV18    NV18    NV18    NV18    0-51,104-155    0\nGPU3    NV18    NV18    NV18     X      NV18    NV18    NV18    NV18    0-51,104-155    0\nGPU4    NV18    NV18    NV18    NV18     X      NV18    NV18    NV18    52-103,156-207  1\nGPU5    NV18    NV18    NV18    NV18    NV18     X      NV18    NV18    52-103,156-207  1\nGPU6    NV18    NV18    NV18    NV18    NV18    NV18     X      NV18    52-103,156-207  1\nGPU7    NV18    NV18    NV18    NV18    NV18    NV18    NV18     X      52-103,156-207  1\n```\n\n`CPU Affinity` 列说明哪些 CPU 核心与两组 GPU 同属一区，`NUMA Affinity` 则直接给出 NUMA 编号。\n\n既然组件分布在多个组，应尽量让通信留在组内，避免跨组访问。例如 gpu0 属于 NUMA 0，驱动它的进程就只使用 NUMA 0 的 CPU 核心。\n\n网络及其他可控制组件也应遵循同样原则。\n\n根据我的经验，CPU 工作很轻时，整体改善很小；大量使用 CPU 时，影响可能很大。不过，如果实现最佳做法很容易，即使很小的收益也会在长时间训练中累积，因此值得做。\n\n### NUMA 进程绑定\n\n有多种方法将进程绑定到正确 NUMA 节点的 CPU 核心。\n\n#### numactl\n\n常用工具是 `numactl`，它在启动进程时设置 NUMA 亲和性。\n\n下面介绍与 `torchrun` 启动器的集成。\n\n\n这个启动器目前需要辅助工具 [numa-set.sh](../source-assets/training/performance/benchmarks/numa/numa-set.sh) 来设置 NUMA 亲和性。下载并添加执行权限后，可以这样设置：\n\n```bash\ntorchrun --nproc_per_node=8 --role : --tee 3 --no-python ./numa-set.sh your-program.py\n```\n\n\n注意：系统必须安装 `numactl` 才能使用该工具。\n\n例如，可以这样验证分配是否正确：\n\n```bash\ntorchrun --nproc_per_node=8 --role : --tee 3 --no-python ./numa-set.sh python -c \\\n'import os; cores=os.sched_getaffinity(0); print(f\"{len(cores)} visible cpu cores: {cores}\")'\n```\n\n\n在具有 208 个超线程 CPU 逻辑核的系统上，通常会看到：\n\n```\n[:0]:104 visible cpu cores: {0, 1, 2, 3, 4, 5...\n[:1]:104 visible cpu cores: {0, 1, 2, 3, 4, 5...\n[:2]:104 visible cpu cores: {0, 1, 2, 3, 4, 5...\n[:3]:104 visible cpu cores: {0, 1, 2, 3, 4, 5...\n[:4]:104 visible cpu cores: {52, 53, 54, 55, ...\n[:5]:104 visible cpu cores: {52, 53, 54, 55, ...\n[:6]:104 visible cpu cores: {52, 53, 54, 55, ...\n[:7]:104 visible cpu cores: {52, 53, 54, 55, ...\n```\n\n\n前 4 个加速器使用前一半 CPU 核，另外 4 个使用后一半，符合前面介绍的正确配置。\n\n移除 `./numa-set.sh` 后：\n\n```bash\ntorchrun --nproc_per_node=8 --role : --tee 3 --no-python python -c \\\n'import os; cores=os.sched_getaffinity(0); print(f\"{len(cores)} visible cpu cores: {cores}\")'\n```\n\n\n会发现全部 8 个进程都能看到全部 208 个 CPU 核：\n\n```\n[:0]:208 visible cpu cores: {0, 1, 2, 3, ...\n```\n\n\n每个进程都可以使用任意 CPU 核，因此可能发生跨 NUMA 节点访问，带来少量性能开销。\n\n#### os.sched_setaffinity\n\n当然，也可以在程序启动后修改 NUMA 亲和性。前面用 `os.sched_getaffinity` 读取当前设置，对应的 `os.sched_setaffinity` 则用于修改：\n\n```python\nimport os\nos.sched_setaffinity(0, [0, 1])\n```\n\n\n这里告诉系统，运行此脚本的进程（`0`）只能使用 CPU 核 `0` 和 `1`。\n\n接下来只需以编程方式确定每个加速器进程对应的正确 CPU 核集合。[pynvml](#pynvml) 可以完成这件事。\n\n#### pynvml\n\n使用 NVIDIA GPU 时，`pynvml` 很适合查询 GPU 的各种信息，无须调用 `nvidia-smi`。安装命令是 `pip install nvidia-ml-py`，导入的模块名仍为 `pynvml`。这里用它根据 GPU 索引获取正确的 CPU 亲和性。\n\n[numa-set-pynvml.py](../source-assets/training/performance/benchmarks/numa/numa-set-pynvml.py) 提供了可用的辅助函数，可以在训练循环最前面调用：\n\n```python\nimport os\ngpu_index = int(os.environ.get(\"LOCAL_RANK\", 0))\nset_numa_affinity(gpu_index, verbose=True)\n```\n\n\n务必在初始化 `DataLoader` **之前**调用，才能让 worker 使用正确的 CPU 核！\n\n通常本地进程 rank 等于 GPU 索引，但设置 `CUDA_VISIBLE_DEVICES` 后可能不再成立。这时需要把进程 rank 映射为实际 GPU 索引：\n\n```python\ngpu_index = int(os.environ.get(\"LOCAL_RANK\", 0))\nif \"CUDA_VISIBLE_DEVICES\" in os.environ:\n    ids = list(map(int, os.environ.get(\"CUDA_VISIBLE_DEVICES\", \"\").split(\",\")))\n    gpu_index = ids[gpu_index] # remap\n```\n\n\n另一个需要留意的设置是 `CUDA_DEVICE_ORDER`。它通常默认为 `PCI_BUS_ID`，混用不同 GPU 时也可能设为 `CUDA_DEVICE_ORDER=FASTEST_FIRST`。不过高端服务器配置几乎不会遇到这种情况，通常可以忽略。\n\n#### srun\n\n如果使用 SLURM，并愿意用 `srun` 启动，而不是 `torchrun`、`accelerate` 等，它会自动完成所有绑定工作。完整启动脚本见[这里](../source-assets/orchestration/slurm/launchers/srun-launcher.slurm)。\n\n只需添加以下两项头部配置，即可启用 NUMA 亲和性：\n\n```\n#SBATCH --gres-flags=enforce-binding\n#SBATCH --ntasks-per-socket=4\n```\n\n\n`--ntasks-per-socket=4` 假设机器有 2 个 CPU 插槽和 8 个加速器，即每个插槽对应 `8/2=4` 个加速器。\n\n这种方案更精确：每个进程都分到自己的 CPU 核组，而不仅是让驱动加速器 0–3 的进程共用 NUMA 节点 0 的所有核、驱动加速器 4–7 的进程共用 NUMA 节点 1 的所有核。\n\n#### 不同启动器的支持\n\n不同启动器对 NUMA 亲和性的支持如下：\n\n- [HF Accelerate](https://github.com/huggingface/accelerate)：在 `accelerate` 启动命令中添加 `--enable_cpu_affinity` 即可，要求 `accelerate>0.28.0`。\n- [torchrun](https://github.com/pytorch/pytorch)：没有内置支持，但可以采用[上面的方法](#numactl)。\n- srun：见[上文](#srun)。\n\n## DataLoader\n\n### 异步 DataLoader\n\n默认设置为 `num_workers=0`。这意味着每次调用 `next(iter(dataloader))` 时才实时读取数据，因此会产生 I/O 开销；如有数据变换，也要当场执行。这些工作都会阻塞加速器计算。\n\n解决办法是设置 `num_workers > 0`，使用异步 `DataLoader`。除非 `DataLoader` 特别慢，通常 2 个 worker 就够了：\n\n```\nDataLoader(..., num_workers=2, ...\n```\n\n\n这样调用 `next(iter(dataloader))` 时，数据应该已经完成所有变换，并位于 CPU 内存中。仍然需要把它复制到加速器显存；如何加速这一步，参见[页锁定内存与非阻塞设备复制](#pinned-memory-and-non-blocking-device-copy)。\n\n下面的基准测试模拟较慢的数据变换：[num-workers-bench.py](../source-assets/training/performance/benchmarks/dataloader/num-workers-bench.py)。\n\n```\nnum_workers=0: average time: 5.388\nnum_workers=1: average time: 3.900\nnum_workers=2: average time: 1.333\nnum_workers=3: average time: 0.839\nnum_workers=4: average time: 0.875\n```\n\n\n在这个具体例子里，worker 数增加到 3 之前，速度都在明显提升。如果 `DataLoader` 很轻、工作很少，差异会小得多，但 0 个 worker 的开销总是最大。\n\n可以测量实际工作负载，尝试更小或更大的值来调优。但要记住，每个 worker 都可能消耗大量 CPU 内存。一个 8 加速器节点若每个进程有 2 个 worker，就会额外产生 16 个进程。如今计算节点往往有数百个 CPU 核和数 TB 内存，可以支持很多 worker；过去则不同。\n\n因为数据变换提前异步执行，这种情况下 CPU 和内存速度的影响没那么大。例如使用 2 个 worker 时，只要下一轮的数据准备耗时小于两轮计算耗时，`DataLoader` 就不应成为瓶颈。\n\n注意，`num_workers > 0` 有时也会出问题。PyTorch 的一些相关 issue 多年未解决，表现为 worker 挂起，尤其在使用两个 `DataLoader` 时。BLOOM-176B 训练就遇到过：训练 `DataLoader` 使用 2 个 worker 一切正常，但加入评估 `DataLoader` 后会随机挂起。排查无果后，我们只对评估使用 `num_workers=0`，并大幅降低评估频率。最终完全停止同步评估，改为对保存的中间检查点做 lm-harness 风格的异步评估，也加快了训练。\n\n案例：IDEFICS-80B 训练使用的流式 `DataLoader` 表现很差，每个 worker 都消耗大量内存，而且经常出现峰值。即便约有 1 TiB CPU 内存，也无法启动足够多的 worker，因此 `DataLoader` 成了瓶颈。当时没有时间寻找更好的方案，只能用它完成训练。\n\n### 页锁定内存与非阻塞设备复制\n\n结合以下设置，通常可以缓解 `DataLoader` 瓶颈：\n\n1. `DataLoader(pin_memory=True, ...)`\n2. `batch.to(device=\"cuda\", non_blocking=True)`\n\n其中：\n\n1. 页锁定内存使 CPU 到加速器显存的数据传输更高效。\n2. 非阻塞复制允许计算与数据移动部分重叠，进一步加速。\n\n[pin-memory-non-block-bench.py](../source-assets/training/performance/benchmarks/dataloader/pin-memory-non-block-bench.py) 是一个展示差异的小型基准测试。我在 A100 80GB-PCIe 上得到：\n\n```\npin_memory= True, non_blocking= True: average time: 0.459\npin_memory= True, non_blocking=False: average time: 0.522\npin_memory=False, non_blocking= True: average time: 0.658\npin_memory=False, non_blocking=False: average time: 0.646\n```\n\n\n可见，`pin_memory=True` 配合 `non_blocking=True` 是值得尝试的改动。\n\n更多背景见 [PyTorch 文档](https://docs.pytorch.org/docs/stable/notes/cuda.html#use-pinned-memory-buffers)和 [NVIDIA 文章](https://developer.nvidia.com/blog/how-optimize-data-transfers-cuda-cc/)。\n\n注意：\n\n- 操作系统会特殊处理页锁定内存，即使可用内存不足，也不会将其换出。因此它减少了其他程序可用的内存，使用时需要留意。\n- 我记得有人数次报告使用页锁定内存后遇到问题；主要可能是系统本来 CPU 内存就少，或锁定了过多内存，导致操作系统大量使用交换空间。\n- 测量[每轮迭代 TFLOPS](#tflops-as-a-performance-metric)，比较修改前后的吞吐量，选择效果最好的配置。若把 `DataLoader` 开销与前向／反向以及计算后的工作分别计时，会更容易看清影响。计算后的工作通常是日志记录，有时慢得令人意外。\n\n## torch.compile\n\n`torch.compile` 将模型跟踪成计算图，并生成融合 kernel，从而加速训练和推理。它随 PyTorch 2.0 发布；截至 2026 年 8 月，生态中已有很多项目默认使用它。但对任意模型获得良好加速仍不是自动发生的：跟踪器必须能理解你的代码，工作量也主要在这里。\n\n### 在哪些地方有收益\n\n回看[模型运算剖析](#anatomy-of-models-operations)中的三类运算，它们在编译下的表现差别很大：\n\n1. **张量缩并**已经调用接近硬件极限的厂商 GEMM 库，编译器可改善的空间很小。`mode=\"max-autotune\"` 会搜索 Triton 矩阵乘变体，偶尔可以超过厂商库，但这是最不容易获得收益的一类。\n2. **统计归一化**和第三类**逐元素运算**才是主要收益来源。它们受内存带宽而非计算能力限制：从 HBM 读取输入，做少量运算，再写回结果。Eager 模式每个算子都要经历一次读写；融合为一个 kernel 后，整条运算链只需经历一次。这是 `torch.compile` 优化 Transformer 的主要方式，也解释了为什么大量小算子的模型比大矩阵乘主导的模型获益更多。\n\n因此，可期待的加速取决于每步耗时中第二、三类工作的占比。先用 [PyTorch 性能分析器](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/debug/pytorch.md#profilers)分析，再编译。\n\n如果瓶颈在 kernel 启动而不是带宽，还有另一种收益：`mode=\"reduce-overhead\"` 将一步执行捕获为 CUDA graph，然后回放整个启动序列，避免分别发起数千次 kernel 启动。这对小批量和低延迟推理解码尤其重要，因为此时加速器可能闲等 CPU 派发任务。它会额外占用内存，因为捕获的图需要固定缓冲区；也要求静态形状。\n\n2026-08-09 在单张 NVIDIA B200、`torch=2.13.0+cu130` 上的两组测量，展示了收益范围。两组中的 `forward` 行都是 `no_grad` 下的推理；另外两行涉及反向传播，均开启梯度检查点。这是在该规模下的常见做法，也使 8B 模型的一步计算能装入单卡显存。\n\n第一组是短序列下的小模型：Llama 3.2 1B（`NousResearch/Llama-3.2-1B`），bf16、SDPA，批量 1、序列长度 512。每步只有数毫秒，主要受 kernel 启动开销和第二、三类运算的带宽限制，最有利于发挥 `torch.compile` 的优势。下表为预热后的稳态步耗时，括号内是相对 eager 的加速比：\n\n| 工作负载 | eager | `torch.compile()` | `mode=\"reduce-overhead\"` | `mode=\"max-autotune\"` |\n| :--- | ---: | ---: | ---: | ---: |\n| 前向（推理） | 8.1ms | 3.4ms (2.4x) | 1.9ms (4.2x) | 2.0ms (4.1x) |\n| 前向＋反向 | 48.8ms | 12.6ms (3.9x) | 8.1ms (6.0x) | 8.0ms (6.1x) |\n| 再加 AdamW 更新 | 58.8ms | 18.7ms (3.1x) | 17.6ms (3.3x) | 17.5ms (3.4x) |\n\n第二组是长序列下的大模型：Llama 3.1 8B（`meta-llama/Llama-3.1-8B`），相同数据类型与注意力后端，批量 1、序列长度 8192。每步数百毫秒，几乎全部时间都花在大型矩阵乘上，即第一类运算；厂商 GEMM 库已经让它们接近硬件极限：\n\n| 工作负载 | eager | `torch.compile()` | `mode=\"reduce-overhead\"` | `mode=\"max-autotune\"` |\n| :--- | ---: | ---: | ---: | ---: |\n| 前向（推理） | 152.4ms | 155.6ms (0.98x) | 155.8ms (0.98x) | 154.8ms (0.98x) |\n| 前向＋反向 | 590.7ms | 630.2ms (0.94x) | 629.2ms (0.94x) | 633.7ms (0.93x) |\n| 再加 AdamW 更新 | 637.3ms | 673.8ms (0.95x) | 671.4ms (0.95x) | 680.0ms (0.94x) |\n\n两表的差别说明了关键问题：受开销限制的小模型最多获得约 6 倍加速；计算受限的大模型没有收益，各种编译模式都与 eager 相差几个百分点，而且这里略慢。编译没有失败，只是没有多少可消除的开销。\n\n1B 模型叠加了两种效果。首先，普通一步执行受启动和带宽限制，融合许多小 kernel 本身就很有效。其次，两行含反向传播的测试开启了梯度检查点：丢弃激活，在反向阶段重算整个前向，因此每步运行两次前向。在小模型上，额外前向同样受启动限制；编译器可以像融合原始 kernel 一样融合重算 kernel，吸收掉大部分额外开销，所以前向＋反向和加上 AdamW 两行的加速比大于仅前向。\n\n8B 模型在该序列长度下没有这两种效应：GEMM 已接近 cuBLAS 峰值并占据主导，检查点重算只是增加更多同类矩阵乘；面对半秒量级的计算，编译能消除的启动间隙微不足道。因此三种编译模式都落在约 0.94 倍：`max-autotune` 搜索的 Triton 矩阵乘无法在这些形状上超过 cuBLAS，`reduce-overhead` 的 CUDA graph 消除的启动开销也已可忽略。\n\n预期加速取决于一步执行受带宽或启动开销限制的程度，这正是[性能分析](#where-it-pays-off)要回答的问题：大量小算子的模型，或以小批量、短序列运行的模型，通常收益最大；大形状的密集矩阵乘负载收益最小，有时反而变慢。\n\n冷启动成本真实存在；稳态收益很小或没有收益时，它决定了编译是否值得。使用全新 Inductor 缓存，默认编译的首次前向＋反向约为 22 秒（1B）和 47 秒（8B）；`max-autotune` 则增至 83 秒和 168 秒。1B 模型很快能收回成本：默认编译每步节省约 35ms，约 600 步后抵消初始成本，此后都是收益。8B／8192 配置没有可摊销的稳态收益，编译后反而略慢，因此编译时间完全是成本，在这种形状下无法收回；对于仅十步的冒烟测试尤为不利。\n\n优化器更新不会增加这项编译成本：成本在于编译模型。已有前向／反向图后，把 `opt.step()` 放入计时区间不会重新编译。同一次运行先执行前向＋反向测试、建立图，再测试加 AdamW 的情况，因此后者冷启动列接近零。PyTorch 各版本的编译性能也在改进，所以绝对毫秒数以及 8B 结果的正负，应视为该工具链时点的结果，而非模型的永久特性。\n\n两张表都来自 [torch-compile-bench.py](../source-assets/training/performance/benchmarks/torch-compile-bench.py)。它遍历工作负载和编译模式，每个单元格创建新模型，对涉及反向的负载启用梯度检查点；将首步记为冷启动成本、后续步骤均值记为稳态时间，并逐模式输出相对 eager 的比率。模型、序列长度、批量、种子和模式列表都在文件顶部设置（`SEED = 42`）。默认配置得到上面的 8B 结果；取消 `NousResearch/Llama-3.2-1B` 和 `SEQ = 512` 两行注释即可得到 1B 表，批量仍为 1。种子固定随机输入 token，使重复运行使用相同数据。\n\n### 难点在哪里\n\n跟踪器要把 `forward` 转为图，无法跟踪的部分会产生**图中断（graph break）**：能编译的部分先编译，不能跟踪的部分回退到 eager，然后重新开始一个图。每个中断也是融合边界，因此存在很多中断的模型即使能在 `torch.compile` 下运行，也可能几乎没有收益。依赖数据的控制流、`.item()`、`print` 和不受支持的操作都会导致图中断。\n\n另一个陷阱是**重新编译**。编译图针对跟踪时的形状特化，因此新序列长度会触发重编译。重编译次数受 `torch._dynamo.config.recompile_limit` 限制，默认 8 次；超过后编译器放弃该函数，之后直接使用 eager。常见原因是变长批次。如果输入形状变化，通常应使用 `torch.compile(model, dynamic=True)`：提前编译形状通用的图，牺牲一些峰值性能，以避免反复重编译。形状变化时应默认考虑它，不必等发现重编译才补救。\n\n这两种问题都可以打印出来：\n\n```bash\nTORCH_LOGS=\"graph_breaks,recompiles\" python train.py\n```\n\n\n日志会把每个图中断对应到触发它的代码行，把每次重编译对应到失败的 guard。`torch.compile(model, fullgraph=True)` 会将图中断升级为错误，是快速找出它们的方法。\n\n首次执行需要花时间编译，任何使缓存失效的变化也会再次带来编译成本。若模型由重复 `n` 次的同一种块组成，编译单个块而非整个模型可以显著降低成本：编译器只做一次工作，各层复用结果。\n\n如果尝试后仍不工作：\n\n1. 可以向 PyTorch 团队报告，最好提供最小可复现示例。\n2. 可以按 PyTorch 官方的 [torch.compile 故障排查指南](https://docs.pytorch.org/docs/stable/user_guide/torch_compiler/torch.compiler_troubleshooting.html)逐项排查。该指南与编译器同步维护，涵盖上述各种失败模式；有些问题可以自行解决，有些仍需要反馈给 PyTorch。\n\n使用较新的 PyTorch 版本；编译器在版本间改进显著，旧版本的问题可能已在当前稳定版解决。\n\n## 自动垃圾回收\n\nPython 根据内部启发式规则定期自动进行垃圾回收。在数百至数千个加速器同步执行的 LLM 训练中，即使各 rank 代码路径只有细微差别，也可能在不同时刻触发垃圾回收。执行回收的一个或多个 rank 会变慢，成为拖慢整个集群的慢进程。\n\n通常可以从 [MFU 曲线](#mfu-vs-hfu)中的向下尖峰看出这种现象。\n\n若训练遇到此问题，可以在训练器开头禁用自动垃圾回收：\n\n```python\nimport gc\ngc.disable()\n```\n\n\n然后按所需间隔手动回收，例如每轮训练迭代调用一次：\n\n```python\nimport gc\ngc.collect()\n```\n\n\n更多细节见 [`gc` 文档](https://docs.python.org/3/library/gc.html)。\n\n## 内存分析工具\n\n本章讨论了各种功能理论上应消耗多少 MB 内存，但实际情况往往不同。你可能已规划好模型规模和批量，实际运行却突然内存不足。这时需要检查真实代码和模型，确定各部分分别占用多少内存，找出计算错误或漏算的额外开销。\n\n为此可以使用内存分析器，现有工具有很多。\n\n我开发的 [IPyExperiments](https://github.com/stas00/ipyexperiments) 可以方便地对每行或每块代码做快速分析。只需把代码放入 Jupyter notebook，它就会自动报告每个代码块分配或释放多少 CPU／GPU 内存。例如，可以查看加载模型用了多少内存，以及单次推理又额外占用了多少，并获得峰值内存报告。\n", "anchors": ["software-tune-up-for-the-best-performance", "glossary-and-concepts", "macs-vs-flop-vs-flops-vs-flops", "tflops-as-a-performance-metric", "automating-flop-calculation", "mfu-vs-hfu", "mfu-is-a-very-rough-approximation", "how-to-improve-speed-and-save-memory", "anatomy-of-models-operations", "anatomy-of-models-memory-usage", "additional-gpu-memory-usage", "preloaded-cuda-kernels-memory-usage", "torchdistributed-memory-usage", "choosing-between-nccl-nccl2-and-nccl-lazy", "memory-fragmentation", "batch-sizes", "gradient-accum
