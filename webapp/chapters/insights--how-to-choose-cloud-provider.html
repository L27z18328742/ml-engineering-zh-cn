<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>如何选择云服务商 · ML Engineering 中文版</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/katex/katex.min.css"></head><body><header class="topbar"><a class="brand" href="../index.html">ML Engineering 中文版</a><nav class="chapnav"><a href="../full.html">全文阅读</a><a href="https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/insights/how-to-choose-cloud-provider.md">英文原文</a></nav></header><div class="layout"><aside class="sidebar"><nav class="toc"><h2>本章目录</h2></nav></aside><main class="main"><article class="prose"><script type="application/json" class="document-data">{"markdown": "# 如何选择云服务商\n\n长期、短期使用过多家计算云，也参加过许多前期需求沟通会议之后，我认识到：选择云服务商必须极其认真、谨慎。长期合同尤其如此，你可能被三年合约锁住，支付数百万美元，却体验糟糕，还无法退出。\n\n举例来说，64 节点集群三年的费用很容易达到 2000 万至 5000 万美元，往往比初创公司的工资总支出还高。\n\n必须再三强调：签下一份糟糕的三年合同，可能让你的初创公司无法成功。\n\n本文不会点名哪些云应该避开，而是帮助你避免糟糕体验，至少获得合格服务，让公司有机会成功。\n\n这些笔记假设你已经知道具体工作负载需要什么算力。如果还不清楚，请先浏览[加速器](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator)、[存储](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/storage)和[网络](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/network)章节，了解可用选项。多数时候，你会希望使用云服务商能提供的最新产品。\n\n## 术语表\n\n- CSP：Cloud Service Provider，云服务提供商。\n- SLA：Service Level Agreement，服务等级协议。\n- SLO：Service Level Objective，服务等级目标。\n- TCO：Total Cost of Ownership，总拥有成本。\n\n## 最重要的三个问题\n\n根据我有限的经验，有三个问题必须弄清楚：\n\n1. **GPU 一定会故障。**关键是多久能更换、流程是什么。每次都要找人处理，会痛苦又缓慢；最好的 CSP 提供 API，让你自行操作。还要警惕那些没有真正更换、只是重新交还的故障 GPU：技术人员检查时看似正常，一运行你的负载又会坏。这里介绍如何[检测是否拿回了同一批故障 GPU](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator/nvidia/debug.md#how-to-detect-if-you-get-the-same-broken-node-again-and-again)。\n2. **你会遇到许多问题，主要来自硬件。**必须知道多久能联系到真正能解决问题的工程师。报告通常先交给 PM，由其分诊并寻找合适人员，但这往往耗时数小时或数天，有时还要升级处理，尤其当 PM 经验不足时。\n3. **必须知道能否解除合同、要多久、代价多少。**如果团队处境恶化，却无法离开，就可能导致成员耗竭，影响推进工作和团队成功。\n\n## 合同\n\n按小时付费，不太需要担心长期合同。但长期来看，这种方式费用高数倍，也缺少稳定可靠的加速器基础。有时，优秀谈判者谈下的长期合同，能让总拥有成本和时间节省达到 10 倍！\n\n### 免费试用\n\n多数 CSP 提供试用，可以免费使用几个节点几天或几周，实际体验。\n\n它当然无法说明更大集群的扩展表现，但足以运行不少基准和实验。\n\n如果免费套餐包含支持，这也是检验客户支持服务的好机会。\n\n### 不成熟的方案\n\n加速器大约每 12–18 个月更新一代，客户为了竞争优势，希望最新硬件“昨天就能用”。这几乎不给 CSP 留下集成、测试、适配软件和老化测试的时间。\n\n因此，新一代刚上市就使用，几乎注定会遇到问题，因为把事情做好需要时间，通常是几个月。但客户说了算，所以 CSP 交付客户想要的东西，却未必坦白系统尚未准备好。\n\n我不确定是否该责怪 CSP，因为制造商也常比承诺晚几个月交货。CSP 此时无法兑现对客户的承诺，于是先交付再说。\n\n有些 CSP 为了提高利润，自研网络栈等硬件，却没能按时完成。最新加速器到了，整体系统却运行不畅。采用现成组件通常更稳妥，因为这些组件更可能经过充分测试，代价可能是价格更高。\n\n客户希望提早使用硬件，我认为没问题，但应该诚实披露，例如：“我们还需要三个月左右才能完善系统。如果你现在就要节点，可以提供，但无法保证表现。”\n\n### “尽最大努力”条款\n\n许多长期云合同包含大量“我们将尽最大努力”条款。\n\n然而：\n\n1. 客户不能只是“尽最大努力”付款，而必须依法按时足额支付。\n2. 客户不能在期限结束前解除合同。\n\n我的经验是，一线云所谓的“尽最大努力”，有时体现为派十几个人参加客户会议。其中一些人不理解问题，只是坐在那里，让公司显得资源充足：“看，我们给你的问题安排了十几个人，不必担心。”但多数时候，他们无法解决问题。\n\n实际上，只需要两个人参加：一位产品经理，以及直接负责解决问题的工程师。根据我的经验，这样的会议可能要等数周到数月，甚至根本不会发生，通常要有关系才能把问题升级到高层。\n\n购买套餐中的每个关键组件，都应有可量化的交付指标。例如，承诺网络在指定节点数下运行 all-reduce 达到 X GBps，而实测明显低于它，合同应规定 CSP 如何处理。存储、加速器及其他关键组件也一样。\n\n具体后果需要你谈判，但可能最有效的是：问题解决前停止付款，这样才有解决动力。\n\n当然，停付有帮助，但算力不能用仍然是大问题。解约并迁移到另一家也是大工程，不能轻率对待。不过，至少没有得到所需服务时，你还有办法可想。\n\n也必须说明，问题几乎从来不在工程师本人。他们通常经验丰富、能力出色，更多是管理和资源分配问题。因此，应尽量温和对待接触的人，同时坚定要求解决。我知道这很难；我也不止一次被逼到极限，未能始终保持冷静。\n\n### 服务等级协议\n\n承接上一节，[服务等级协议（SLA）](https://en.wikipedia.org/wiki/Service-level_agreement)是服务商与客户对服务质量、可用性及双方责任的保证和预期。\n\n另一个术语是服务等级目标（SLO），用于量化 SLA。例如，规定月度可用率为 99.5%，低于这一水平时，服务商按消费金额的一定比例返还额度：99–99.5% 返 10%，95–99% 返 25% 等。这是一个 [GCP SLA 示例](https://cloud.google.com/ai-platform/training-and-prediction/sla?hl=en)。\n\n租用 ML 集群，最应关注加速器或整节点故障。付了 64 个节点的钱却只能用 60 个，应对无法使用的节点获得退款或额度补偿。SLA 要规定故障持续多久后开始补偿，以及补多少。\n\n网络和存储同理，虽然比加速器故障少，但仍会故障。\n\n总体上，服务的每个关键部分都应有 SLO，以及不达标时的明确后果。\n\n多数一线公司在合同中已有标准 SLA。理论上客户可以协商适配自身需求，但不一定总能做到。有时支付更多费用，可以获得高于标准的 SLO。\n\n### 商定解约条款\n\n双方都应获得互利的商业体验。\n\n如果对方无法满足约定，合作不再有益，你应能合法退出合同。\n\n当然，最好不必打官司：诉讼昂贵，一线云有充足资金聘请顶尖律师，你可能处于不利地位。\n\n需要自行谈判，明确什么情况下可以在期限结束前顺利解约。\n\n### 必须包含付费支持\n\n我曾任职的一家公司，为省钱没有在云合同中购买付费支持，只能通过客户聊天渠道求助。结果因此损失了数天算力。\n\n不要在这里省钱，否则会损失大量金钱、开发者时间，甚至头发。确保能提交带优先级的工单，并在合同中明确处理时限。\n\n通过客户聊天求助紧急问题时，对方没有及时处理的义务，甚至可能根本没有必须行动的义务。\n\n如果对接的是 PM，还要知道多久能跳过中间传递，直接联系最终负责的工程师。\n\n### 非工作时间支持\n\n周末、节假日和夜间，紧急情况是否有人支持？例如，我用过的一家 HPC 只在周一至周五 9 点到 17 点提供人工支持。\n\n如果没有，至少确保团队能够自行恢复集群，并演练验证确实可行。这意味着必须有 API，让你不依赖服务商支持也能执行所需操作。\n\n### 迁移到下一代加速器\n\n平均每 12–18 个月会有新一代加速器，而典型合同为三年，因此大约一半时间你都在使用性能较落后的产品。\n\n新型号快 2–5 倍时，没人愿意继续用旧设备，但多数客户被旧加速器锁住整整三年。\n\n应协商在合同到期前迁移到新一代的权利，当然通常需要额外付费。\n\n### 确保所有加速器位于同一区域\n\n新加速器刚推出时，往往不在你现有设备所在区域。除非完全放弃旧资源、整体搬到新区域，否则维护多份存储会非常麻烦。为保证性能，存储必须与加速器同地，否则要同步多份数据，还可能长期支付高昂出入站流量费。提前规划并讨论，是否能把旧一代资源迁到新设备所在区域。这不一定可行，可能需要等更多设备到货，但必须讨论这个条款。\n\n## 加速器\n\n下面这些问题专门针对加速器。\n\n### 加速器需要老化测试\n\n新组件到货后，服务商应先进行充分压力测试，也就是“老化测试”，发现故障加速器和其他系统组件，再交给客户。\n\n否则，客户只能在运行工作负载时痛苦地筛出坏设备，损失算力和开发时间。只有少量节点时，一个加速器故障通常影响不大；数十或数百节点时，代价极高。\n\n发现坏加速器不该是客户的责任。压力测试不能保证以后不故障，但故障应当很少。\n\n未经充分筛选的新批次，故障率常有 3–10%，对客户而言惊人且昂贵。\n\n所以，要询问服务商是否做过老化测试、持续多久。\n\n我还没有找到公认的黄金标准。例如，[SemiAnalysis](https://newsletter.semianalysis.com/p/ai-neocloud-playbook-and-anatomy#%C2%A7cluster-deployment-and-acceptance-test) 建议 OEM 做 3–4 周老化，CSP 再做 2–3 天老化／验收。因此，至少应确保系统经过 2–3 天压力测试。如果不介意故障导致走走停停，也完全可以把大规模训练当测试；顺利运行就已经推进了工作。当然，应确保训练能持续压满系统各部分。\n\n### 处理加速器故障\n\n我的经验是，虽然其他组件偶尔也坏，但 95% 的故障来自加速器。\n\n因此，必须有清晰、快速的更换路径。\n\n最好自动化：询问是否提供释放故障节点并获取替代节点的 API。依赖人工通常效果不好，自动化越充分，体验越高效。\n\n服务商为你准备了多少备用加速器？通常会承诺每月一定数量的快速更换。\n\n不过，如果时间关键，应始终多租约 10% 的节点，因为多数时候无法立即获得替换。额外节点平时用于开发，训练节点坏了就能立即接替。\n\n### 确保节点位于同一网络 spine\n\n除非租用一万块 GPU，否则较小集群通常可以放在同一网络 spine 下，让任意两节点间通信耗时一致。\n\n用于故障替换、你未付费的备用节点，也应与付费节点位于同一 spine。否则，多节点训练会遇到大问题：那个替换节点离其他节点更远，成为最弱链路，拖慢整个集群。\n\n### 重启后保留已验证的加速器\n\n应采用固定资源分配。重新部署节点，尤其是计划停机时，其他客户不能把这些节点抢走。\n\n花了数周筛掉坏节点后，必须保留这些好节点，避免重做痛苦又昂贵的筛选。\n\n### 将来是否需要扩容？\n\n这很难提前判断。\n\n理想情况下，应与服务商讨论，让其为可能到来的扩容做准备。\n\n否则，想把节点翻倍时，新节点可能只能放到另一条网络 spine，影响训练速度。\n\n你可能不得不放弃当前分配，迁到更大的一组资源；当地容量不够时，甚至要换区域。跨区域意味着存储也要迁移，可能极慢且昂贵。根据亲身经历，千万不要轻视。\n\n## 存储\n\n容量大、速度快的存储，对于开发体验以及训练、微调、推理性能都很重要，尤其是检查点加载与保存。\n\n### 保证的最大容量\n\n询问付费容量中，有多少是保证可用的。\n\n例如，使用 Lustre 时，客户需要知道，为获得目标可用容量，可能必须多配 25%。由于磁盘均衡设计问题，总使用率到 80% 时就可能写入失败，而额外 25% 的费用由客户承担！\n\n我用过的大多数其他文件系统，通常能正常用到 100%，但针对具体系统仍应询问。\n\n### 了解存储 I/O 需求\n\n我们在一家云上使用非并行分布式文件系统，开发体验极差。大文件还可以，小文件却极慢：安装基础 Conda 环境要 30 分钟，执行 `python -c \"import torch\"` 要 2 分钟。Python 包含数万个 4–16 KB 文件，文件系统若未优化小文件、元数据服务器又弱，就会非常令人沮丧。\n\n通常，Python 团队需要文件系统同时处理：\n\n- 数万个微小文件。\n- 少量巨型文件。\n\n当然，只有你知道工作负载的具体需求。也要考虑本地与远程共享存储的关系：有些服务商为省钱，会缩减本地盘容量和性能。许多共享文件系统中的代码库、模型、数据集可以缓存到本地。教团队使用 [rsync](https://linux.die.net/man/1/rsync) 配合本地 NVMe，可以改善开发体验并减少共享文件系统 I/O。\n\n存储需求和基准测试的细节参见[存储章节](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/storage)。\n\n### 存储故障时怎么办\n\n先进且昂贵的分布式文件系统故障概率较小，廉价方案则高得多，但任何系统都可能故障。\n\n需要知道：\n\n- 谁负责修复？\n- 恢复要多久？\n- 谁承担停机费用？\n- 问题期间用户怎么办？\n\n如果修复很久，通常需要额外临时文件系统分区，让大家继续工作，当然又要付钱。\n\n### 区域迁移\n\n升级加速器或扩容时，如果当前区域没有所需资源，集群可能被迫迁移。为保证工作流速度，存储必须与加速器在同一区域。\n\n这会触发可能极其痛苦的存储迁移。\n\n应在迁移开始很久前问清：\n\n- 服务商负责搬数据，还是你负责？\n- 工具能否在几小时内迁移数 TB，还是要很多天？通过对象存储云中转通常会丢掉文件元数据，可能是大问题。500 万个小文件可能复制极久；用 `tar` 又可能打包数小时，而且是否有两倍空间同时放两份数据？\n- 迁移重叠期间，两套集群的存储与计算是否都要付费？\n- 迁移期间编辑、新建的文件怎么办？要让所有人停工，并冻结文件系统吗？\n\n### 备份与归档\n\n许多 CSP 只提供一种文件存储档位和价格，但组织可能需要多档。例如，将旧模型检查点或微调数据集归档到便宜的冷存储，如基于 HDD 的 S3 对象存储。\n\n能灵活扩大总容量，并同步“热”（本地 NVMe）、“温”（共享 NVMe）、“冷”（共享 HDD）与“归档”（磁带）各层，有助于提高韧性、节省费用，并方便以后迁移或扩容。\n\n## 网络\n\n本节主要面向训练和微调。若只是大量微服务推理，或少量按需交互工作，例如 notebook，可以忽略；唯一例外是单个模型副本就需要多个节点的超大模型推理。\n\n总体应确保[节点内](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/network/README.md#intra-node-networking)和[节点间](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/network/README.md#inter-node-networking)速度符合承诺与预期。测试时询问平台需要哪些 NCCL 环境变量；一个稳妥默认值是 `NCCL_NVLS_ENABLE=2`，可用时使用 NVLink SHARP。\n\n### 索取实际性能数据\n\n计算理论从不完全符合现实。即使组件相同，服务商之间实际表现也可能相差巨大，取决于所有组件的质量，以及机架设计和组装水平。\n\n最简单的要求是索取 4、8、16、32、64 节点的 `all-reduce` 基准曲线；集群更大，就要求更多节点。节点增加时带宽会逐渐下降，但不应剧烈恶化。有些网络在大节点数下效率很差。\n\n详情参见[实际网络吞吐量](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/network/README.md#real-network-throughput)。\n\n理想情况下，应测几个与实际工作负载集体通信相匹配的负载。我通常先要约 4–16 GiB 大负载曲线，最新高速节点间网络在 16 GiB 时能取得最佳带宽，这能立即看出网络好坏。不过，也很可能需要了解 256–512 MiB，因此不妨要求更宽范围。\n\n我采用过最实用的方法，是向 CSP 索取其自己的 `nccl-tests` `all-reduce` 结果，分别测单节点和 4–16 节点。每家都会展示最好的一面，因此拿到的是最佳情况，恰好能作为 SLA 中要求兑现的指标。可以向他人询问这些数字是否符合硬件水平，通常是符合的。拿到节点后，自己运行同一测试，应该能复现这些结果。若不能，说明实际分配与你看到的演示有区别，此时就有具体、可量化的问题可升级处理，而不是泛泛抱怨“网络感觉慢”。\n\n补充说明：应提前索取，而不是谈 SLA 时才问。那时太晚，对方已没有动力展示最佳表现。\n\n我还没见过 NVLink 在不同地方表现不同，除非软件配置有误，但仍应要求单节点测试。\n\n### 网络会占用加速器显存吗？\n\n一家云曾让我意外：开始使用 GPU 才发现，每块已有 5 GiB 被网络软件占用。后来降低了一些，但实际上卖给我们的 GPU 可用显存少于标称容量，签约前却没有告知。\n\n未来加速器显存更大时，这可能不重要；但 H100 从 80 GiB 变成仅可用 75 GiB，每块损失都很大。\n\n### InfiniBand 还是以太网？\n\nCSP 通常遵循 NVIDIA [DGX SuperPOD 参考架构](https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/abstract.html)，其中详细说明了 rail-optimized InfiniBand 网络。简单说，8-GPU 系统中的每块 GPU 接入各自的 leaf 交换机，其余采用标准胖树结构。\n\n不过，世界上许多最大的 GPU 集群现在采用 RoCEv2，而非 InfiniBand。Meta 已[证明](https://engineering.fb.com/2024/08/05/data-center-engineering/roce-network-distributed-ai-training-at-scale/)，RoCEv2 网络能够训练前沿级 Llama 模型。SemiAnalysis／Fabricated Knowledge 展示了 NVIDIA GPU 网络产品配套销售率的[明显下降](https://www.fabricatedknowledge.com/p/nvidia-waiting-on-blackwell-and-whats?utm_source=post-banner&utm_medium=web&utm_campaign=posts-open-in-app&triedRedirect=true)。\n\n多节点训练依赖 NCCL、RCCL 等集体通信，因此网络类型会显著影响性能与使用体验。\n\n## 如何评估集群\n\n拿到试用节点后，测量本文讨论的三大子系统。先在*自己的实际分配*上复现，才能把 CSP 幻灯片中的数字作为 SLA 依据。工具就在本书中；相同流程的 agent 操作手册是 [evaluate-cluster/SKILL.md](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/skills/evaluate-cluster/SKILL.md)。\n\n使用**隔离的 venv**，不要修改节点的 `dev` conda／环境。如果已有较新的 torch，且 CUDA 构建匹配 GPU，可以复用；否则安装当前稳定 CUDA wheel，以及 `nvidia-ml-py`（MAMF 遥测）、`matplotlib`（all-reduce 绘图）和 `fio`。\n\n大规模扫描前，先在单节点运行 [`torch-distributed-gpu-test.py`](../source-assets/debug/torch-distributed-gpu-test.py)，让故障 NCCL／GPU 在几秒内暴露，而不是等到 16 GiB all-reduce 时才出问题。\n\n### A. 网络\n\n节点内：使用 [`torch-dist-bench.py`](../source-assets/network/benchmarks/torch-dist-bench.py)，通过 `torchrun --nproc_per_node=8` 启动，或按实际 GPU 数设置。节点间：同一脚本至少运行于 **4 个节点**。脚本头部的 `pdsh` 方案要求节点之间 SSH 免密；另一种支持的启动方式是 SLURM `srun`。参见[网络基准测试](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/network/benchmarks/README.md)和[实际网络吞吐量](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/network/README.md#real-network-throughput)。\n\n应报告单向 **`busbw`**。节点内，与标称 NVLink 单向带宽比较，不用双向带宽；NVLS／SHARP 可能让按 ring 公式计算的数字超过规格的 100%，且只加速 **all-reduce**。节点间报告 `busbw` 和 NCCL 路径，**不要**除以标称 IB／RoCE／EFA GBps，因为集体通信从来不是只测 NIC。如果只有一个节点，跳过节点间测试并注明；单节点 NVLink 数字无法说明四节点 fabric 表现。\n\n### B. 计算\n\n**MAMF 顺序执行，其他 GPU 空闲。** 对节点的**每块 GPU**，逐块以 `CUDA_VISIBLE_DEVICES=i` 运行 [`mamf-finder.py`](../source-assets/compute/accelerator/benchmarks/mamf-finder.py) `--search auto`。这是筛查坏设备的步骤，一个慢 GPU 就能拖垮整个节点。将 MAMF／MSMF 与[加速器表格](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator/README.md#tflops-comparison-table)中的官方 TFLOPS 比较，细节参见[基准测试 README](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/compute/accelerator/benchmarks/README.md)。\n\n**DCGM（`dcgmi diag -r 2`）。** 检查显存、PCIe／NVLink 等硬件健康，不是测 FLOPS；8 块 GPU 上不超过约 10.5 分钟。`-r 1` 只测软件，不足够；`-r 3` 是可选的更长压力测试。需要 `nv-hostengine`，来自 NVIDIA CUDA 仓库的 `datacenter-gpu-manager-4-cudaN` 包。容器无法运行时，记录限制，保留 MAMF 测试。\n\n再做一次 8 卡*并发*测试，回答的是另一个问题：共享供电与散热是否拉低满载频率。这有价值，但不能替代“这些 GPU 是否健康”的主要结论。\n\n### C. 存储\n\n按 [fio 文档](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/storage/README.md#fio)，对**本地 NVMe**与**共享文件系统**路径分别运行 [`fio-scan`](../source-assets/storage/fio-scan)。两者都需要：NVMe 是上限，共享文件系统才是 DataLoader 和检查点实际访问的位置。默认每个挂载点 6 项测试、每项 3 分钟，总计约 18 分钟。16 KiB 小文件延迟代表开发体验，1 GiB 顺序访问代表检查点性能。\n\n在带日期的报告末尾写明**结论**：计算、网络、存储各给一个判断，再列出**注意项**，包括测试缺口和仅仅“可用但不优秀”的地方。不要让读者从表格中自行寻找结论。\n\n## 安全\n\n安全有时被事后才考虑，但不同 CSP 的做法差别很大。仅获得 SOC 2 Type 2 认证未必够。应检查机器是否虚拟化；如果不在 VM 内，而云上还有其他租户，你可能无法信任他们在其他机器上的行为。最好确认服务商在首次或重新分配服务器前，会核验 BMC、系统和 BIOS 固件为已知可信版本。\n\n## 其他事项\n\n### 一线云与二线云\n\n对于 AWS、GCP、Azure 等一线云，与新兴较小的二线云谁更好，我还没有明确建议。直觉上，二线云为了赢得客户，可能提供更好、更贴身的支持。\n\n价格方面，二线云通常更便宜，否则无法竞争。但它们没有一线云的批量采购能力，所以利润空间显然更小。\n\n二线云可能更灵活，提供 AMD、Intel 等非主流加速器，也更可能免费或低价帮助调优。\n\n### 编排\n\n成熟可靠的节点编排，是成功使用多节点集群的关键。\n\n明确自己需要哪种，通常是 [SLURM](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/orchestration/slurm)、Kubernetes 或二者组合，并确认支持完善。有些云只支持一种，对另一种支持很有限。目前 SLURM 主要用于训练／微调，Kubernetes 用于推理，也有其他[新兴编排平台](https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/orchestration)。\n\n与硬件一样，无论是否自己管理集群，都要明确谁解决问题。编排是关键组件，一旦损坏，所有人都无法使用集群，时间和金钱都会流失。\n\n### 软件与操作系统版本应保持较新\n\n确认服务商不会强制使用过时的软件和操作系统。\n\n我曾被迫使用非常旧的 Ubuntu，因为必须依赖的服务商软件栈不支持更新系统。\n\n### 系统管理\n\n如今很难找到理解 ML 特殊需求的优秀系统管理员，因此应询问能否将部分工作交给 CSP。一线 CSP 会分包给服务公司，提供不同程度的系统管理；小型云可能直接提供服务，通常也了解 ML 工作负载。\n\n没有经验丰富的人维护集群，很难成功。让 ML 工程师兼做系统管理，可能适得其反，因为这类工作耗时且频繁打断其他任务。\n\n要么招聘系统管理员，要么聘请服务公司。\n\n## 结语\n\n这些笔记基于我的直接经验，显然没有覆盖所有可能破坏集群、让团队耗竭甚至大量掉头发的问题，但应该能作为思考的起点。\n\n根据对你重要的事情，以及哪些故障会阻碍算力目标，补充自己的问题。\n\n如果正在考察某家 CSP，向社区打听，尤其询问该云有哪些陷阱需要避开。\n\n本文核心是：选择一家不会剥夺你选择权的云，避免被开发者厌恶的服务锁住，否则可能导致人才离开公司。\n\n如果这些笔记让你觉得难以独自处理，我偶尔提供尽职调查咨询，也会参加前期沟通会议。可联系 [stas@stason.org](mailto:stas@stason.org?subject=Choosing%20cloud%20consulting)。\n\n## 延伸阅读\n\n- semianalysis.com 创建了 ClusterMax CSP 评级体系，详细解释不同标准，并计划持续评估更多 CSP。[2025 年文章](https://newsletter.semianalysis.com/p/the-gpu-cloud-clustermax-rating-system-how-to-rent-gpus)\n", "anchors": ["how-to-choose-a-cloud-provider", "glossary", "the-most-important-questions-to-ask", "contracts", "free-trials", "half-baked-solutions", "we-will-do-our-best-clause", "service-level-agreement", "discuss-a-contract-breaking-clause", "must-have-paid-support-included", "support-during-off-hours", "next-generation-accelerator-migration", "ensure-all-acceler
