<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据集处理 · ML Engineering 中文版</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/katex/katex.min.css"></head><body><header class="topbar"><a class="brand" href="../index.html">ML Engineering 中文版</a><nav class="chapnav"><a href="../full.html">全文阅读</a><a href="https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/training/datasets.md">英文原文</a></nav></header><div class="layout"><aside class="sidebar"><nav class="toc"><h2>本章目录</h2></nav></aside><main class="main"><article class="prose"><script type="application/json" class="document-data">{"markdown": "# 处理数据集\n\n## 在主进程中预处理和缓存数据集\n\nHF Accelerate 提供了非常方便的上下文管理器 [`main_process_first`](https://huggingface.co/docs/accelerate/v0.4.0/accelerator.html#accelerate.Accelerator.main_process_first)，可以这样编写代码：\n\n```python\nwith accelerator.main_process_first():\n    # load and pre-process datasets\n    dataset = datasets.load_dataset(...)\n    # optionally cache it and have the rest of the processes load the cache\n```\n\n从而代替下面这种不够直观、需要重复编写代码的方式：\n\n```python\nif rank == 0:\n    dataset = datasets.load_dataset(...)\ndist.barrier()\nif not rank == 0:\n    dataset = datasets.load_dataset(...)\n```\n\n应该在主进程中下载和处理数据，而不是让所有进程都执行这些操作。否则，各进程会并行重复相同的工作，而且很可能写入同一个位置，导致输出相互交错并损坏。从 I/O 的角度来看，串行执行这类工作通常也快得多。\n\n这里有 `main_process_first` 和 `local_main_process_first` 两种上下文管理器。前者适用于数据位于共享文件系统、所有计算节点都能访问的情况；后者适用于数据保存在每个节点本地的情况。\n\n如果没有使用 HF Accelerate，我也实现了类似的上下文管理器，只是名称不同：\n\n- `global_main_process_first`：用于共享文件系统。\n- `local_main_process_first`：用于节点本地文件系统。\n\n可以在[这里](../source-assets/training/tools/main_process_first.py)找到它们。\n\n如果希望编写能自动适配共享和本地文件系统的通用代码，该怎么办？我还增加了一个辅助函数，自动识别所使用的文件系统类型，并据此调用合适的上下文管理器。它叫作 `main_process_by_path_first`，用法如下：\n\n```python\npath = \"/path/to/data\"\nwith main_process_by_path_first(path):\n    # load and pre-process datasets\n    dataset = datasets.load_dataset(...)\n    # optionally cache it and have the rest of the processes load the cache\n```\n\n可以在[这里](../source-assets/training/tools/main_process_first.py)找到它。\n\n除了上下文管理器，当然还需要判断主进程类型的工具函数。因此，也提供了三个与上述管理器对应的函数：\n\n- `is_main_process_by_path(path)`\n- `is_local_main_process()`\n- `is_global_main_process()`\n\n这些函数都在[这里](../source-assets/training/tools/main_process_first.py)。\n\n运行下面的命令即可查看它们的实际效果：\n\n```bash\npython -u -m torch.distributed.run --nproc_per_node=2 --rdzv_endpoint localhost:6000  --rdzv_backend c10d tools/main_process_first.py\n```\n", "anchors": ["dealing-with-datasets", "preprocessing-and-caching-datasets-on-the-main-process"]}</script></article><nav class="pager"><a href="training--re-train-hub-models.html">← 上一章 · 从头训练 HF Hub 模型</a><a href="insights--ai-battlefield.html">下一章 → · AI 战场上的工程经验</a></nav><footer class="pagefoot">非官方中文译本 · 原作者 Stas Bekman 及贡献者 · 原文与译文采用 CC BY-SA 4.0 · 译文保留原文时点与作者观点。</footer></main></div><script src="../assets/marked.min.js"></script><script src="../assets/katex/katex.min.js"></script><script src="../assets/katex/auto-render.min.js"></script><script src="../assets/reader.js"></script></body></html>
