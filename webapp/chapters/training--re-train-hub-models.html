<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从头训练 HF Hub 模型 · ML Engineering 中文版</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/katex/katex.min.css"></head><body><header class="topbar"><a class="brand" href="../index.html">ML Engineering 中文版</a><nav class="chapnav"><a href="../full.html">全文阅读</a><a href="https://github.com/stas00/ml-engineering/blob/fb75494c0d9e536f048e27be2869a77fe65ad9f4/training/re-train-hub-models.md">英文原文</a></nav></header><div class="layout"><aside class="sidebar"><nav class="toc"><h2>本章目录</h2></nav></aside><main class="main"><article class="prose"><script type="application/json" class="document-data">{"markdown": "# 利用微调示例从头训练 HF Hub 上的模型\n\nHF Transformers 提供了出色的微调示例：https://github.com/huggingface/transformers/tree/main/examples/pytorch 。这些示例几乎涵盖所有模态，而且开箱即用。\n\n**但如果想从头训练，而不是微调，该怎么办？**\n\n下面介绍一个简单的变通方法。\n\n这里以 `facebook/opt-1.3b` 为例，并计划采用 bf16 训练：\n\n```bash\ncat \u003c\u003c EOT > prep-bf16.py\nfrom transformers import AutoConfig, AutoModelForCausalLM, AutoTokenizer\nimport torch\n\nmname = \"facebook/opt-1.3b\"\n\nconfig = AutoConfig.from_pretrained(mname)\nmodel = AutoModelForCausalLM.from_config(config, torch_dtype=torch.bfloat16)\ntokenizer = AutoTokenizer.from_pretrained(mname)\n\npath = \"opt-1.3b-bf16\"\n\nmodel.save_pretrained(path)\ntokenizer.save_pretrained(path)\nEOT\n```\n\n然后运行：\n\n```bash\npython prep-bf16.py\n```\n\n这会创建 `opt-1.3b-bf16` 文件夹，包含从头训练模型所需的一切。换句话说，你得到了一个形式上类似预训练模型的模型，但它只完成了初始化，还没有进行任何训练。\n\n如果计划使用 `torch.float16` 或 `torch.float32`，相应修改上面的脚本即可。\n\n现在可以像平常微调一样，继续训练这个已经保存的模型：\n\n```bash\ntorchrun \\\n--nproc_per_node=1 --nnode=1 --node_rank=0 \\\n--master_addr=127.0.0.1 --master_port=9901 \\\nexamples/pytorch/language-modeling/run_clm.py --bf16 \\\n--seed 42 --model_name_or_path opt-1.3b-bf16 \\\n--dataset_name wikitext --dataset_config_name wikitext-103-raw-v1 \\\n--per_device_train_batch_size 12 --per_device_eval_batch_size 12 \\\n--gradient_accumulation_steps 1 --do_train --do_eval --logging_steps 10 \\\n--save_steps 1000 --eval_steps 100 --weight_decay 0.1 --num_train_epochs 1 \\\n--adam_beta1 0.9 --adam_beta2 0.95 --learning_rate 0.0002 --lr_scheduler_type \\\nlinear --warmup_steps 500 --report_to tensorboard --output_dir save_dir\n```\n\n其中关键参数是：\n\n```\n--model_name_or_path opt-1.3b-bf16\n```\n\n这里的 `opt-1.3b-bf16` 就是上一步生成的本地目录。\n\n有时可以找到原模型训练时使用的相同数据集，有时则必须使用替代数据集。\n\n其余超参数通常可以在模型随附的论文或文档中找到。\n\n总之，这种方法让你能够利用微调示例，从头训练 [HF Hub](https://huggingface.co/models) 上找到的模型。\n", "anchors": ["re-train-hf-hub-models-from-scratch-using-finetuning-examples"]}</script></article><nav class="pager"><a href="training--emulate-multi-node.html">← 上一章 · 单节点模拟多节点</a><a href="training--datasets.html">下一章 → · 数据集处理</a></nav><footer class="pagefoot">非官方中文译本 · 原作者 Stas Bekman 及贡献者 · 原文与译文采用 CC BY-SA 4.0 · 译文保留原文时点与作者观点。</footer></main></div><script src="../assets/marked.min.js"></script><script src="../assets/katex/katex.min.js"></script><script src="../assets/katex/auto-render.min.js"></script><script src="../assets/reader.js"></script></body></html>
